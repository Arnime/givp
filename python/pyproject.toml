[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "givp"
version = "1.0.1"
description = "GRASP-ILS-VND with Path Relinking — direction-agnostic metaheuristic optimizer."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.16"
authors = [{ name = "Arnaldo Mendes Pires Junior" }]
keywords = [
    "optimization",
    "metaheuristic",
    "grasp",
    "ils",
    "vnd",
    "path-relinking",
    "global-optimization",
    "julia",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24,<2.3.2; python_version < '3.14'",
    "numpy>=2.3.2,<3; python_version >= '3.14'",
    "xxhash>=4.0.1",
    "scikit-learn>=1.0",
    # SciPy 1.18.0 wheels currently fail to import ``_spropack`` on
    # CPython 3.13. Keep the known-good line for supported pre-3.14 runtimes.
    "scipy>=1.15.3,<1.18; python_version < '3.14'",
    "scipy>=1.18,<1.19; python_version >= '3.14'",
]

[project.optional-dependencies]
dev = [
    "build>=1.4.4",
    "pytest>=9.0.3",
    "pytest-cov>=5",
    "pytest-xdist>=3.5",
    "ruff>=0.16.3",
    "pre-commit>=3.7",
    "black>=26.5.1",
    "mypy>=2.3.1",
    "hypothesis>=6.165.9",
    "pytest-benchmark>=4.0",
    "tomli>=2.0; python_version < '3.11'",
    "tqdm>=4.66",
]
benchmarks = [
    "optuna>=3.0",
    "pymoo>=0.6.1",
    "matplotlib>=3.8",
    "pandas>=2.2",
]
fuzz = ["atheris>=2.3.0; sys_platform == 'linux'"]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "markdown>=3.8.1",
    "pymdown-extensions>=10.21.3",
    "idna>=3.15",
    "build>=1.4.4",
]
notebooks = [
    "jupyter>=1.1",
    "jupyter-server>=2.19.0",
    "ipykernel>=6.29",
    "matplotlib>=3.8",
    "mistune>=3.2.1",
    "pandas>=2.2",
]
parallel = ["cloudpickle>=3.0"]

[project.scripts]
givp = "givp.cli:main"

[project.urls]
Homepage = "https://github.com/Arnime/givp"
Repository = "https://github.com/Arnime/givp"
Issues = "https://github.com/Arnime/givp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/givp"]
# TestPyPI's upload client does not yet accept Core Metadata 2.5.
# Version 2.4 fully represents this project's declared metadata.
core-metadata-version = "2.4"

[tool.hatch.build.targets.wheel.force-include]
"src/givp/py.typed" = "givp/py.typed"

[tool.hatch.build.targets.sdist]
core-metadata-version = "2.4"
include = [
    "src/givp",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=givp --cov-report=term-missing --cov-fail-under=95 --strict-markers -m 'not slow and not quality_gate'"
markers = [
    "slow: tests that are not run by default; use -m slow to enable",
    "quality_gate: statistical convergence gate — verifies algorithm achieves minimum quality threshold; use -m quality_gate to run",
]

[tool.pytest-benchmark]
storage = "benchmarks/.results"

[tool.mutmut]
paths_to_mutate = "src/givp/"
tests_dir = "tests/"
runner = "python -m pytest tests/ -q --no-cov -x"

[tool.coverage.run]
branch = true
source = ["givp"]

[tool.coverage.report]
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
    "pragma: no cover",
]

[tool.mypy]
python_version = "3.10"
files = ["src/givp"]
# Strict-ish settings: every check that previously needed an opt-out has
# been resolved. Future regressions show up in CI immediately.
warn_unused_configs = true
warn_redundant_casts = true
warn_unreachable = true
warn_return_any = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true
disable_error_code = []

[[tool.mypy.overrides]]
module = ["conan", "conan.*"]
ignore_missing_imports = true

[tool.black]
line-length = 88

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S", "RUF", "PERF", "PT", "RET"]
ignore = [
    "E501",    # line length handled by formatter
    "S101",    # asserts are fine in tests
    "S311",    # numpy/random not crypto
    "PT011",   # pytest.raises(Exception) is fine in our negative tests
    "PERF401", # list.extend micro-opt; revisit during impl split
    "RUF046",  # int() over already-int; revisit during impl split
    "RUF002",  # ambiguous unicode in PT-BR docstrings
    "RET504",  # unnecessary assignment before return; readability win
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S", "PT"]
"benchmarks/**/*.py" = ["S", "PT"]

[tool.pylint.main]
# Ruff is the canonical linter; Pylint runs only inside IDEs.
# Keep it quiet for test files and idiomatic pytest patterns.
# ``ignore-paths`` accepts regexes matched against the *full* path the IDE
# passes to pylint, so we ignore test and notebook directories regardless of
# their path separator or the capitalization used for ``Notebooks``.
ignore-paths = [".*[\\\\/]tests[\\\\/].*", ".*[\\\\/][Nn]otebooks[\\\\/].*"]

[tool.pylint.format]
max-line-length = 120
max-module-lines = 2000

# [tool.pylint."messages control"]
# disable = [
#     "missing-module-docstring",
#     "missing-class-docstring",
#     "missing-function-docstring",
#     "import-outside-toplevel",
#     "unused-argument",
#     "unused-variable",
#     "redefined-outer-name",
#     "protected-access",
#     "line-too-long",
#     "too-many-lines",
#     "too-few-public-methods",
#     "too-many-arguments",
#     "too-many-locals",
#     "too-many-positional-arguments",
#     "duplicate-code",
# ]

[tool.poetry]
packages = [{ include = "givp", from = "src" }]

[tool.poetry.group.dev.dependencies]
# Build backend — required by .github/scripts/install-package.sh
hatchling = ">=1.30.1"
# Test suite
pytest = ">=9.1.1"
pytest-cov = ">=5"
pytest-xdist = ">=3.5"
pytest-benchmark = ">=4.0"
hypothesis = ">=6.165.9"
tqdm = ">=4.66"
# Type-checking and linting
mypy = ">=2.3.1"
ruff = ">=0.16.3"
black = ">=26.5.1"
# Developer tooling
build = ">=1.4.4"
bandit = ">=1.9"
pre-commit = ">=4.6.1"
nox = "^2026.4.10"
# Interactive / notebooks (local dev)
jupyter-server = ">=2.19.0"
mistune = ">=3.2.1"
notebook = "^7.5.6"

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6"
mkdocs-material = ">=9.5"
mkdocstrings = { version = ">=0.26", extras = ["python"] }
markdown = ">=3.8.1"
pymdown-extensions = ">=10.21.3"
idna = ">=3.18"
build = ">=1.4.4"

[tool.poetry.group.benchmarks.dependencies]
optuna = ">=4.9.0"
pymoo = ">=0.6.1"
matplotlib = ">=3.8"
pandas = ">=2.2"

[tool.poetry.group.conan.dependencies]
conan = ">=2.28,<3"

[tool.poetry.group.fuzz.dependencies]
atheris = { version = ">=2.3.0", markers = "sys_platform == 'linux'" }

[tool.poetry.group.notebooks.dependencies]
jupyter-server = ">=2.20.0"
mistune = ">=3.3.0"
notebook = "^7.5.6"

[tool.poetry.group.audit.dependencies]
pip = "==26.2.1"
pip-audit = ">=2.7"

[tool.poetry.group.mutation.dependencies]
mutmut = ">=3.3"
build = ">=1.4.4"

[tool.poetry.group.release.dependencies]
build = ">=1.0"
cyclonedx-bom = ">=4.0"

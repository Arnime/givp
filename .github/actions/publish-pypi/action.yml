name: Publish Python distribution
description: Publish an existing Python distribution using the pinned PyPI publisher.
inputs:
  packages-dir:
    description: Directory containing the built distributions.
    required: false
    default: dist
  repository-url:
    description: Legacy upload endpoint for PyPI or TestPyPI.
    required: false
    default: https://upload.pypi.org/legacy/
  skip-existing:
    description: Treat already uploaded files as successful.
    required: false
    default: "true"
  attestations:
    description: Publish attestations alongside distributions.
    required: false
    default: "true"
runs:
  using: composite
  steps:
    - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
      with:
        packages-dir: ${{ inputs.packages-dir }}
        repository-url: ${{ inputs.repository-url }}
        skip-existing: ${{ inputs.skip-existing }}
        attestations: ${{ inputs.attestations }}

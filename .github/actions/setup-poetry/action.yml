name: Setup Poetry
description: Install the reviewed Poetry release through a commit-pinned action.
inputs:
  poetry-version:
    description: Exact Poetry version to install.
    required: false
    default: "2.4.1"
runs:
  using: composite
  steps:
    - name: Install Poetry
      uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2
      with:
        version: ${{ inputs.poetry-version }}

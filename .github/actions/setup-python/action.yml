name: Setup Python
description: Install a pinned Python setup action with CI defaults.
inputs:
  python-version:
    description: Python version or range to install.
    required: false
    default: "3.13"
  allow-prereleases:
    description: Allow pre-release Python builds.
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
      with:
        python-version: ${{ inputs.python-version }}
        allow-prereleases: ${{ inputs.allow-prereleases }}

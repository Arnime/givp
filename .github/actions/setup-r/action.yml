name: Setup R
description: Install R and resolve package dependencies with shared defaults.
inputs:
  r-version:
    description: R version or channel.
    required: false
    default: release
  working-directory:
    description: Package directory for dependency resolution.
    required: false
    default: r
  extra-packages:
    description: Comma-separated packages for r-lib/actions setup.
    required: false
    default: ""
  dependencies:
    description: Dependency level accepted by r-lib/actions setup-r-dependencies.
    required: false
    default: ""
  cache:
    description: Enable dependency caching.
    required: false
    default: "true"
  pak-version:
    description: pak version for r-lib/actions, or none to install the stable pak without sudo.
    required: false
    default: none
runs:
  using: composite
  steps:
    - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      with:
        r-version: ${{ inputs.r-version }}
        use-public-rspm: true
    - if: inputs.pak-version == 'none'
      name: Install pak without sudo
      shell: bash
      env:
        R_LIB_FOR_PAK: ${{ runner.temp }}/Library
      run: |
        mkdir -p "$R_LIB_FOR_PAK"
        # Run from a script file: on Windows, Rscript -e drops the inner double quotes.
        script="${RUNNER_TEMP}/install-pak.R"
        cat > "$script" <<'EOF'
        install.packages(
          "pak",
          lib = Sys.getenv("R_LIB_FOR_PAK"),
          repos = sprintf(
            "https://r-lib.github.io/p/pak/%s/%s/%s/%s",
            "stable", .Platform$pkgType, R.Version()$os, R.Version()$arch
          )
        )
        EOF
        Rscript "$script"
    - if: inputs.dependencies == ''
      uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      env:
        RENV_PROJECT: ${{ github.workspace }}/${{ inputs.working-directory }}
        R_LIB_FOR_PAK: ${{ runner.temp }}/Library
      with:
        working-directory: ${{ inputs.working-directory }}
        extra-packages: ${{ inputs.extra-packages }}
        cache: ${{ inputs.cache }}
        pak-version: ${{ inputs.pak-version }}
    - if: inputs.dependencies != ''
      uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
      env:
        RENV_PROJECT: ${{ github.workspace }}/${{ inputs.working-directory }}
        R_LIB_FOR_PAK: ${{ runner.temp }}/Library
      with:
        working-directory: ${{ inputs.working-directory }}
        dependencies: ${{ inputs.dependencies }}
        extra-packages: ${{ inputs.extra-packages }}
        cache: ${{ inputs.cache }}
        pak-version: ${{ inputs.pak-version }}

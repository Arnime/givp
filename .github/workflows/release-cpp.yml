name: Release C++

on:
  workflow_call:
    inputs:
      tag:
        description: "Release tag (for example v1.0.1)"
        required: true
        type: string
    outputs:
      artifact_name:
        description: "Artifact name containing the C++ release assets"
        value: ${{ jobs.prepare-artifacts.outputs.artifact_name }}
      semver:
        description: "Validated semantic version without the v prefix"
        value: ${{ jobs.validate.outputs.semver }}
      hashes:
        description: "Base64-encoded SHA256 subjects for SLSA provenance"
        value: ${{ jobs.prepare-artifacts.outputs.hashes }}
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

permissions:
  contents: read

jobs:
  validate:
    name: Validate C++ release tag
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ steps.version.outputs.semver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - id: version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if [[ "$TAG" != "v$VERSION" ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a vX.Y.Z semantic-version tag, got '$TAG'."
            exit 1
          fi
          CMAKE_VERSION="$(python - <<'PY'
          import re
          from pathlib import Path

          content = Path("cpp/CMakeLists.txt").read_text(encoding="utf-8")
          match = re.search(
              r"project\(\s*givp\s+VERSION\s+([0-9A-Za-z.+-]+)", content
          )
          if match is None:
              raise SystemExit("Unable to read the version from cpp/CMakeLists.txt.")
          print(match.group(1))
          PY
          )"
          if [[ "$CMAKE_VERSION" != "$VERSION" ]]; then
            echo "::error::Tag $TAG does not match the CMake project version $CMAKE_VERSION."
            exit 1
          fi
          echo "semver=$VERSION" >> "$GITHUB_OUTPUT"

  test-multiplatform:
    name: Test on ${{ matrix.os }} (${{ matrix.compiler }})
    needs: validate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-latest, compiler: gcc, cc: gcc, cxx: g++ }
          - { os: ubuntu-latest, compiler: clang, cc: clang, cxx: clang++ }
          - { os: windows-latest, compiler: msvc, cc: cl, cxx: cl }
          - { os: macos-latest, compiler: clang, cc: clang, cxx: clang++ }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Set compiler (non-Windows)
        if: matrix.compiler != 'msvc'
        run: |
          echo "CC=${{ matrix.cc }}" >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"
      - name: Configure, build, and test
        run: |
          cmake -S cpp -B cpp/build/release-test -DCMAKE_BUILD_TYPE=Release -DGIVP_BUILD_TESTS=ON -DGIVP_BUILD_BENCHMARKS=OFF -DGIVP_BUILD_FUZZ=OFF
          cmake --build cpp/build/release-test --config Release
          ctest --test-dir cpp/build/release-test --build-config Release --output-on-failure

  validate-package:
    name: Validate CMake package installation
    needs: [validate, test-multiplatform]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - name: Install and consume the package
        run: |
          cmake -S cpp -B cpp/build/package-install -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install" -DGIVP_BUILD_TESTS=OFF \
            -DGIVP_BUILD_BENCHMARKS=OFF -DGIVP_BUILD_FUZZ=OFF
          cmake --build cpp/build/package-install --target install
          test -d install/include/givp
          test -f install/lib/cmake/givp/givpConfig.cmake
          cmake -S cpp/consumer_check -B cpp/build/consumer-release \
            -DCMAKE_PREFIX_PATH="$PWD/install" -DCMAKE_BUILD_TYPE=Release
          cmake --build cpp/build/consumer-release

  prepare-artifacts:
    name: Prepare C++ release artifacts
    needs: [validate, validate-package]
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.artifact.outputs.name }}
      hashes: ${{ steps.artifact.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
      - id: artifact
        env:
          VERSION: ${{ needs.validate.outputs.semver }}
        run: |
          set -euo pipefail
          TARBALL="givp-cpp-${VERSION}.tar.gz"
          CHANGELOG_PATH="docs/project/changelog.md"
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            CHANGELOG_PATH="CHANGELOG.md"
          fi
          if [[ ! -f "$CHANGELOG_PATH" ]]; then
            echo "::error::No changelog was found for the release archive."
            exit 1
          fi
          tar --exclude='.git' --exclude='build*' --exclude='.venv' --exclude='target' \
            --exclude='node_modules' --exclude='*.pyc' -czf "$TARBALL" \
            cpp/ LICENSE "$CHANGELOG_PATH" CODE_OF_CONDUCT.md
          sha256sum "$TARBALL" > "${TARBALL}.sha256"
          echo "name=cpp-release-artifacts-${VERSION}" >> "$GITHUB_OUTPUT"
          echo "hashes=$(sha256sum "$TARBALL" | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            givp-cpp-*.tar.gz
            givp-cpp-*.sha256
          if-no-files-found: error

name: Release Context

on:
  workflow_call:
    inputs:
      tag:
        description: "Existing release tag in vX.Y.Z SemVer format"
        required: true
        type: string
    outputs:
      tag:
        description: "Validated release tag"
        value: ${{ jobs.validate.outputs.tag }}
      version:
        description: "Validated version without the v prefix"
        value: ${{ jobs.validate.outputs.version }}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.context.outputs.tag }}
      version: ${{ steps.context.outputs.version }}
    steps:
      - id: context
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(printf '%s' "$INPUT_TAG" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
          VERSION="${TAG#v}"
          if [[ "$TAG" != "v$VERSION" ]] || ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Expected a vX.Y.Z semantic-version tag, got '$TAG'."
            exit 1
          fi
          if ! gh api "repos/${GH_REPO}/git/ref/tags/${TAG}" >/dev/null; then
            echo "::error::Release tag $TAG does not exist in $GH_REPO."
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

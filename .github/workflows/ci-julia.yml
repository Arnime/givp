name: CI Julia

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions: {}

jobs:
  setup:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      source_changed: ${{ steps.pick.outputs.source_changed }}
      config_changed: ${{ steps.pick.outputs.config_changed }}
      validation_required: ${{ steps.pick.outputs.validation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_changed=false
            config_changed=false
            if git diff --name-only "$PR_BASE" HEAD -- julia/src julia/test | grep -q .; then
              echo 'versions=["1.9","1.10","1.11","1.12"]' >> "$GITHUB_OUTPUT"
              source_changed=true
            else
              echo 'versions=["1"]' >> "$GITHUB_OUTPUT"
            fi
            if git diff --name-only "$PR_BASE" HEAD -- julia/Project.toml julia/Manifest.toml julia/test/Project.toml julia/test/Manifest.toml .github/actions/setup-julia .github/workflows/ci-julia.yml codecov.yml | grep -q .; then
              config_changed=true
            fi
            echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
            echo "config_changed=$config_changed" >> "$GITHUB_OUTPUT"
            if [[ "$source_changed" == true || "$config_changed" == true ]]; then
              echo 'validation_required=true' >> "$GITHUB_OUTPUT"
            else
              echo 'validation_required=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'versions=["1.9","1.10","1.11","1.12"]' >> "$GITHUB_OUTPUT"
            echo 'source_changed=true' >> "$GITHUB_OUTPUT"
            echo 'config_changed=true' >> "$GITHUB_OUTPUT"
            echo 'validation_required=true' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.validation_required == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        julia-version: ${{ fromJson(needs.setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        continue-on-error: true
        with:
          version: ${{ matrix.julia-version }}
          delete-old-caches: false

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
          '

      - name: Run tests
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=julia -e 'using Pkg; Pkg.test()'

  coverage:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"
          delete-old-caches: false

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
          '

      - name: Run tests with coverage
        env:
          JULIA_NUM_THREADS: auto
        run: julia --project=julia -e 'using Pkg; Pkg.test(; coverage=true)'

      - name: Process coverage
        run: |
          julia -e '
            using Pkg
            Pkg.add("CoverageTools")
            using CoverageTools
            coverage = process_folder("julia/src")
            LCOV.writefile("julia-lcov.info", coverage)
          '

      - name: Check coverage gate (≥95%)
        run: |
          julia -e '
            using Pkg; Pkg.add("CoverageTools")
            using CoverageTools
            cov = process_folder("julia/src")
            let
              hit = 0
              total = 0
              for s in cov
                for c in s.coverage
                  c === nothing && continue
                  total += 1
                  c > 0 && (hit += 1)
                end
              end
              pct = total > 0 ? hit / total * 100.0 : 0.0
              println("Julia coverage: $(round(pct; digits=1))%  ($hit / $total lines)")
              pct >= 95.0 || (println("::error::Coverage below 95% threshold (got $(round(pct; digits=1))%)"); exit(1))
            end
          '

      - name: Check patch coverage on PR (>= 90%)
        if: github.event_name == 'pull_request'
        run: |
          julia <<'JLEOF'
            base = ENV["PR_BASE_SHA"]
            threshold = 90.0

            diff = read(`git diff --unified=0 $(base)...HEAD -- julia/src`, String)
            changed = Dict{Tuple{String,Int},Bool}()
            current = nothing

            for line in split(diff, "\n")
              if startswith(line, "+++ b/")
                current = line[7:end]
                continue
              end
              m = match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
              if current !== nothing && m !== nothing
                start = parse(Int, m.captures[1])
                len = m.captures[2] === nothing ? 1 : parse(Int, m.captures[2])
                for ln in start:(start + max(len, 0) - 1)
                  changed[(current, ln)] = true
                end
              end
            end

            changed_lines = [k for k in keys(changed) if startswith(first(k), "julia/src/")]
            if isempty(changed_lines)
              println("Julia patch coverage: N/A (no changed lines in julia/src)")
              exit(0)
            end

            cov = Dict{Tuple{String,Int},Int}()
            current_file = nothing
            for raw in eachline("julia-lcov.info")
              if startswith(raw, "SF:")
                f = raw[4:end]
                marker = "/givp/"
                idx = findfirst(marker, f)
                current_file = idx === nothing ? lstrip(f, '.') : f[last(idx)+1:end]
              elseif startswith(raw, "DA:") && current_file !== nothing
                parts = split(raw[4:end], ",")
                ln = parse(Int, parts[1])
                hits = floor(Int, parse(Float64, parts[2]))
                cov[(current_file, ln)] = hits
              elseif raw == "end_of_record"
                current_file = nothing
              end
            end

            total = length(changed_lines)
            covered = count(k -> get(cov, k, 0) > 0, changed_lines)
            pct = covered / total * 100
            println("Julia patch coverage: $(round(pct; digits=1))%  ($(covered) / $(total) changed lines)")
            if pct + 1e-9 < threshold
              println("::error::Julia patch coverage below $(threshold)% threshold (got $(round(pct; digits=1))%)")
              exit(1)
            end
          JLEOF
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: julia-lcov.info
          flags: julia
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  coverage-gate:
    name: coverage-julia
    needs: [setup, coverage]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report Julia coverage status
        env:
          SETUP_RESULT: ${{ needs.setup.result }}
          SOURCE_CHANGED: ${{ needs.setup.outputs.source_changed }}
          COVERAGE_RESULT: ${{ needs.coverage.result }}
        run: |
          if [ "$SETUP_RESULT" != success ]; then
            echo "::error::Julia change detection did not complete successfully."
            exit 1
          fi
          if [ "$SOURCE_CHANGED" != true ]; then
            echo "Julia coverage is not applicable: no Julia source or test changes."
            exit 0
          fi
          if [ "$COVERAGE_RESULT" != success ]; then
            echo "::error::Julia coverage job finished with '$COVERAGE_RESULT'."
            exit 1
          fi
          echo "Julia coverage passed."

  format:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
          '

      - name: Check formatting (JuliaFormatter)
        run: |
          before_hash="$(git diff -- ':(glob)julia/**/*.jl' | git hash-object --stdin)"
          julia -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.activate(; temp=true)
            Pkg.add("JuliaFormatter")
            using JuliaFormatter
            format("julia/"; overwrite=true)
          '
          after_hash="$(git diff -- ':(glob)julia/**/*.jl' | git hash-object --stdin)"
          if [ "$before_hash" != "$after_hash" ]; then
            echo "::error::Julia code is not formatted."
            echo "::error::Fix locally with: julia --project=julia -e 'using JuliaFormatter; format(\"julia/\"; overwrite=true)'"
            git --no-pager diff -- ':(glob)julia/**/*.jl'
            exit 1
          fi

  fuzz:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
          '

      - name: Run fuzz trials
        run: |
          julia --project=julia julia/fuzz/fuzz_givp.jl \
            --n-trials 100 \
            --seed 1337 \
            --timeout 90

  benchmark_smoke:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    name: Benchmark smoke (Julia)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install benchmark dependencies
        run: |
          julia --project=julia/benchmarks -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.instantiate()
          '

      - name: Verify baseline algorithm imports
        run: |
          julia --project=julia/benchmarks -e '
            using Optim
            using Evolutionary
            println("Benchmark baseline packages loaded: Optim, Evolutionary")
          '

      - name: Run literature comparison smoke test
        run: |
          julia --project=julia/benchmarks julia/benchmarks/run_literature_comparison.jl \
            --n-runs 2 \
            --dims 3 \
            --max-iter 10 \
            --time-limit 2 \
            --algorithms GIVP-full DE PSO GA CMA-ES SA \
            --output julia/benchmarks/ci_smoke_results.json

      - name: Generate literature comparison smoke report
        run: |
          julia --project=julia/benchmarks julia/benchmarks/generate_report.jl \
            --input julia/benchmarks/ci_smoke_results.json \
            --format both

  lint:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
          '

      - name: Run Aqua package quality checks
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["Aqua"])
            using GIVPOptimizer, Aqua
            Aqua.test_all(
              GIVPOptimizer;
              ambiguities = (broken = false,),
              stale_deps = (ignore = [:JSON, :Aqua, :JET],),
            )
            println("Aqua: all checks passed ✓")
          '

      - name: Run JET static type analysis
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.add(["JET"])
            using GIVPOptimizer, JET
            result = JET.report_package("GIVPOptimizer"; ignored_modules=(Base, Core))
            reports = JET.get_reports(result)
            if !isempty(reports)
              for r in reports
                println("::warning file=julia/src::JET: ", r)
              end
              println("JET: warnings detected (informational) ✓")
            else
              println("JET: no type-inference errors ✓")
            end
          '

  audit:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Check dependency status
        run: |
          julia -e '
            using Pkg
            Pkg.activate("julia")
            Pkg.Registry.update()
            rm(joinpath("julia", "Manifest.toml"); force=true)
            Pkg.instantiate()
            Pkg.status()
            println("Pkg.status: dependency check complete ✓")
          '

      - name: Check for unsafe FFI calls in source
        run: |
          if grep -rn --include="*.jl" -E '\bccall\b|\b@ccall\b|\bunsafe_' julia/src/; then
            echo "::error::Unsafe FFI call (ccall/@ccall/unsafe_*) found in julia/src/."
            echo "::error::Review each occurrence and add an explicit justification comment."
            exit 1
          fi
          echo "No unsafe FFI calls found in julia/src/ ✓"

      - name: Generate SBOM (dependency manifest)
        run: |
          julia -e '
            using Dates, Pkg
            Pkg.activate("julia")
            deps = Pkg.dependencies()
            open("julia-sbom.txt", "w") do io
              println(io, "# GIVPOptimizer.jl — dependency manifest")
              println(io, "# Generated: ", string(Dates.now()))
              for (_, info) in sort(collect(deps); by = x -> x[2].name)
                println(io, info.name, " @ ", something(info.version, "stdlib"))
              end
            end
          '

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: julia-sbom
          path: julia-sbom.txt
          retention-days: 90

  benchmark_regression:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.instantiate()
            Pkg.add("BenchmarkTools")
          '

      - name: Run benchmark regression (informational)
        run: |
          julia --project=julia -e '
            using BenchmarkTools, GIVPOptimizer, JSON
            sphere(x) = sum(x .^ 2)
            bounds = [(-5.12, 5.12) for _ in 1:5]
            cfg = GIVPConfig(; max_iterations=30, vnd_iterations=50, ils_iterations=3)

            # Warm up
            givp(sphere, bounds; seed=0, config=cfg)

            b = @benchmark givp($sphere, $bounds; seed=0, config=$cfg) samples=10 evals=1
            med_ms = median(b).time / 1e6

            println("Benchmark median: $(round(med_ms; digits=1)) ms")
            println("Min: $(round(minimum(b).time/1e6; digits=1)) ms  Max: $(round(maximum(b).time/1e6; digits=1)) ms")

            # Read baseline if it exists; otherwise write it (first run)
            baseline_file = joinpath("julia", "benchmarks", "ci_baseline_ms.json")
            if isfile(baseline_file)
              baseline = JSON.parsefile(baseline_file)["median_ms"]
              ratio = med_ms / baseline
              println("Regression ratio vs baseline: $(round(ratio; digits=2))x")
              if ratio > 2.0
                println("::warning::Benchmark regression detected: $(round(ratio;digits=2))x slower than baseline ($(round(baseline;digits=1)) ms)")
              else
                println("Benchmark within tolerance (≤ 2×) ✓")
              end
            else
              open(baseline_file, "w") do io
                JSON.print(io, Dict("median_ms" => med_ms))
              end
              println("No baseline found — wrote new baseline: $(round(med_ms;digits=1)) ms")
            end
          '

      - name: Upload benchmark results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: julia-benchmark-results
          path: julia/benchmarks/ci_baseline_ms.json
          retention-days: 90

  mutation_testing:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true # informational — does not block merge
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install dependencies
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.instantiate()
            Pkg.add("Mousetrap")
          ' || echo "Mousetrap unavailable — using manual mutation script"

      - name: Run mutation testing (≥65% kill rate required)
        run: |
          julia --project=julia -e '
            # Manual lightweight mutation testing on helpers.jl and grasp.jl
            # Applies operator mutations (+ → -, * → /, && → ||) and checks test failure.
            using Pkg, Test

            src_file = joinpath("julia", "src", "helpers.jl")
            src = read(src_file, String)

            mutations = [
              ("+", "-"),   # arithmetic sign flip
              ("<=", "<"),  # boundary relaxation
              (">=", ">"),  # boundary relaxation
              ("&&", "||"), # logical inversion
            ]

            killed = 0; survived = 0; errors = 0

            for (from, to) in mutations
              if !occursin(from, src); continue; end
              mutant = replace(src, from => to; count=1)
              tmp = tempname() * ".jl"
              write(tmp, mutant)
              # Run tests against mutant by overriding helpers.jl
              ret = run(ignorestatus(`julia --project=julia -e "
                include(\"$tmp\")
                using Pkg; Pkg.test(\"GIVPOptimizer\"; test_args=[\"--mutant\"])
              "`))
              if ret.exitcode != 0
                killed += 1   # test suite detected the mutant
              else
                survived += 1
                println("::warning::Mutant survived: $from → $to in helpers.jl")
              end
              rm(tmp; force=true)
            end

            total = killed + survived
            kill_rate = total > 0 ? killed / total * 100.0 : 0.0
            println("Mutation testing: $killed/$total killed ($(round(kill_rate; digits=1))%)")
            if kill_rate < 65.0 && total > 0
              println("::warning::Mutation kill rate $(round(kill_rate;digits=1))% is below 65% threshold")
            else
              println("Mutation kill rate ≥ 65% ✓")
            end
          ' || true

  algorithm-quality-gate:
    needs: [setup, test]
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    name: Algorithm quality gate (convergence assertions)
    runs-on: ubuntu-latest
    # BLOCKING: this job must pass before merging. It verifies that
    # GIVPOptimizer actually converges on standard benchmark functions, not
    # merely that it runs without errors. Thresholds are statistical (median
    # over 5 seeds) and calibrated at the 95th-percentile worst-case for the
    # default GIVPConfig. A failure here indicates an algorithmic regression.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-julia
        with:
          version: "1"

      - name: Install package
        run: |
          julia --project=julia -e '
            using Pkg
            Pkg.Registry.update()
            Pkg.instantiate()
          '

      - name: Run convergence quality gate
        run: |
          julia --project=julia julia/test/test_quality_gate.jl

name: CI Python

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:
    inputs:
      run_mutation:
        description: "Run mutation job (manual only)"
        required: false
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.pick.outputs.versions }}
      source_changed: ${{ steps.pick.outputs.source_changed }}
      config_changed: ${{ steps.pick.outputs.config_changed }}
      validation_required: ${{ steps.pick.outputs.validation_required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            source_changed=false
            config_changed=false
            if git diff --name-only "$PR_BASE" HEAD -- python/src python/tests | grep -q .; then
              echo 'versions=["3.10","3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
              source_changed=true
            else
              echo 'versions=["3.13"]' >> "$GITHUB_OUTPUT"
            fi
            if git diff --name-only "$PR_BASE" HEAD -- python/pyproject.toml python/poetry.lock python/requirements .github/actions/setup-python .github/scripts/bootstrap-poetry.sh .github/scripts/poetry-install.sh .github/workflows/ci-python.yml | grep -q .; then
              config_changed=true
            fi
            echo "source_changed=$source_changed" >> "$GITHUB_OUTPUT"
            echo "config_changed=$config_changed" >> "$GITHUB_OUTPUT"
            if [[ "$source_changed" == true || "$config_changed" == true ]]; then
              echo 'validation_required=true' >> "$GITHUB_OUTPUT"
            else
              echo 'validation_required=false' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'versions=["3.10","3.11","3.12","3.13","3.14"]' >> "$GITHUB_OUTPUT"
            echo 'source_changed=true' >> "$GITHUB_OUTPUT"
            echo 'config_changed=true' >> "$GITHUB_OUTPUT"
            echo 'validation_required=true' >> "$GITHUB_OUTPUT"
          fi

  test:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.validation_required == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ${{ fromJson(needs.setup.outputs.versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev
      - name: Lint
        run: poetry -C python run ruff check src tests
      - name: Type-check
        # Mypy is configured to validate the package's Python 3.10 baseline.
        # Run it once on a stable interpreter; the full matrix still exercises
        # runtime compatibility, including Python 3.14.
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.13'
        run: poetry -C python run mypy
      - name: Test
        run: poetry -C python run python -m pytest --no-cov

  centralized-actions:
    name: Check centralized action pins
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prevent copied action pins
        run: bash .github/scripts/check-centralized-actions.sh
      - name: Check selective PR CI filters
        run: python .github/scripts/check_pr_ci_filters.py

  coverage:
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Coverage not required for this pull request
        if: github.event_name == 'pull_request' && needs.setup.outputs.source_changed != 'true'
        run: echo "No Python source or test changes detected; coverage is not applicable."
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-python
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev
      - name: Test with coverage
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        run: poetry -C python run pytest --cov=givp --cov-report=xml:../coverage-python.xml --cov-fail-under=95
      - name: Check patch coverage on PR (>= 90%)
        if: github.event_name == 'pull_request' && needs.setup.outputs.source_changed == 'true'
        run: |
          python3 - <<'PY'
          import re
          import subprocess
          import xml.etree.ElementTree as ET

          base = "${{ github.event.pull_request.base.sha }}"
          threshold = 90.0

          diff = subprocess.check_output(
            ["git", "diff", "--unified=0", f"{base}...HEAD", "--", "python/src"],
            text=True,
          )

          changed = {}
          current = None
          for line in diff.splitlines():
            if line.startswith("+++ b/"):
              current = line[6:]
              changed.setdefault(current, set())
              continue
            m = re.match(r"^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@", line)
            if current and m:
              start = int(m.group(1))
              length = int(m.group(2) or "1")
              for ln in range(start, start + max(length, 0)):
                changed[current].add(ln)

          changed_lines = {(f, ln) for f, lines in changed.items() for ln in lines if f.startswith("python/src/")}
          if not changed_lines:
            print("Python patch coverage: N/A (no changed lines in python/src)")
            raise SystemExit(0)

          def normalize_filename(fn: str) -> str:
            fn = fn.replace("\\", "/")
            if "/givp/" in fn:
              return "python/src/givp/" + fn.split("/givp/", 1)[1]
            if fn.startswith("givp/"):
              return "python/src/" + fn
            if fn.startswith("./givp/"):
              return "python/src/" + fn[2:]
            return fn

          cov = {}
          root = ET.parse("coverage-python.xml").getroot()
          for cls in root.findall(".//class"):
            fn = normalize_filename(cls.attrib.get("filename", ""))
            for ln in cls.findall(".//line"):
              num = int(ln.attrib.get("number", "0"))
              hits = int(float(ln.attrib.get("hits", "0")))
              cov[(fn, num)] = hits

          coverable_lines = {k for k in changed_lines if k in cov}
          if not coverable_lines:
            print("Python patch coverage: N/A (no coverable changed lines in python/src)")
            raise SystemExit(0)

          total = len(coverable_lines)
          covered = sum(1 for k in coverable_lines if cov.get(k, 0) > 0)
          missing = len(changed_lines) - len(coverable_lines)
          pct = (covered / total) * 100.0
          print(f"Python patch coverage: {pct:.1f}%  ({covered} / {total} coverable changed lines)")
          if missing > 0:
            print(f"::warning::{missing} changed lines are non-coverable in coverage-python.xml and were excluded")
          if pct + 1e-9 < threshold:
            print(f"::error::Python patch coverage below {threshold:.1f}% threshold (got {pct:.1f}%)")
            raise SystemExit(1)
          PY
      - name: Upload coverage to Codecov
        if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-python.xml
          flags: python
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.2.8
          fail_ci_if_error: true

  property-tests:
    name: Property-based tests (Hypothesis max_examples=50)
    needs: setup
    runs-on: ubuntu-latest
    # Run on source changes only; property tests are slow (50 examples × 5 tests)
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev
      - name: Run property tests
        # Run only test_properties.py with a generous timeout; --no-cov keeps it fast.
        # The Hypothesis database is ephemeral in CI; this is intentional.
        run: |
          poetry -C python run pytest tests/test_properties.py -v \
            --no-cov \
            --override-ini="addopts=" \
            -p no:randomly

  benchmark-smoke:
    name: Benchmark smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Informational job: does not block merges, but surfaces regressions
    continue-on-error: true
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install (with benchmark extras)
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev,benchmarks
      - name: Benchmark smoke tests
        run: |
          poetry -C python run pytest -m slow tests/test_benchmark_scripts.py -v \
            --override-ini="addopts="

      - name: Run literature comparison smoke test
        run: |
          poetry -C python run python benchmarks/run_literature_comparison.py \
            --n-runs 2 \
            --dims 3 \
            --max-iter 10 \
            --time-limit 2 \
            --algorithms GIVP-full DE PSO GA CMA-ES SA \
            --output python/benchmarks/ci_smoke_results.json

      - name: Generate literature comparison smoke report
        run: |
          poetry -C python run python benchmarks/generate_report.py \
            --input benchmarks/ci_smoke_results.json \
            --format markdown \
            --no-plots \
            --output-dir python/benchmarks

  algorithm-quality-gate:
    name: Algorithm quality gate (convergence assertions)
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ubuntu-latest
    # BLOCKING: this job must pass before merging. It verifies that GIVP
    # actually converges on standard benchmark functions, not merely that it
    # runs without errors. Thresholds are statistical (median over N_SEEDS
    # runs) and calibrated at the 95th-percentile worst-case for the default
    # GIVP configuration. A failure here indicates an algorithmic regression.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev
      - name: Run convergence quality gate
        run: |
          poetry -C python run pytest -m quality_gate tests/test_algorithm_quality.py \
            -v \
            --no-cov \
            --override-ini="addopts=" \
            --tb=short

  benchmark-regression:
    name: Benchmark regression (informational)
    runs-on: ubuntu-latest
    # Informational: surfaces performance regressions but does not block merges
    continue-on-error: true
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev
      - name: Run performance benchmarks
        run: |
          mkdir -p python/benchmarks/.results
          poetry -C python run pytest benchmarks/test_benchmarks.py \
            --benchmark-only \
            --benchmark-autosave \
            --benchmark-storage=python/benchmarks/.results \
            --override-ini="addopts="
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-${{ github.sha }}
          path: python/benchmarks/.results/
          retention-days: 90

  mutation:
    name: Mutation testing fast gate (≥ 65 % kill rate)
    needs: setup
    runs-on: ubuntu-latest
    # Run on weekly schedule or manually via workflow_dispatch input.
    if:
      github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch'
      && github.event.inputs.run_mutation == 'true')
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install dependencies
        run: |
          bash .github/scripts/poetry-install.sh --only main,dev,mutation
      - name: Remove broken symlinks (mutmut workaround)
        run: |
          BROKEN_LINKS=$(find . -xtype l | wc -l)
          if [ "$BROKEN_LINKS" -gt 0 ]; then
            echo "Removing ${BROKEN_LINKS} broken symlink(s) before mutmut"
            find . -xtype l -print -delete
          else
            echo "No broken symlinks found"
          fi
      - name: Run mutation tests (fast smoke scope)
        run: |
          # Keep CI mutation tests very fast: smoke scope only.
          MUTATE_PATHS="src/givp/api.py"
          TEST_RUNNER="poetry run python -m pytest tests/test_api.py -q --no-cov -x"
          cd python
          poetry run mutmut run \
            --paths-to-mutate "$MUTATE_PATHS" \
            --runner "$TEST_RUNNER" \
            --max-children 8 \
            --no-progress
      - name: Enforce kill-rate gate (≥ 65 %)
        # mutmut exits 0 only when all mutants are killed; we enforce a minimum
        # kill rate so that surviving a few edge-case mutants does not block CI,
        # but a large regression in test quality does.
        run: |
          KILLED=$(poetry -C python run mutmut results 2>/dev/null | grep -cE "^[0-9]+ - [^-]+ - killed" || true)
          TOTAL=$(poetry -C python run mutmut results 2>/dev/null | grep -cE "^[0-9]+ - [^-]+ - (killed|survived|timeout)" || true)
          echo "Killed: ${KILLED}  Total: ${TOTAL}"
          if [ "${TOTAL}" -eq 0 ]; then
            echo "No mutants generated — check mutmut configuration."
            exit 1
          fi
          # Integer arithmetic: kill_rate = KILLED * 100 / TOTAL
          KILL_RATE=$(( KILLED * 100 / TOTAL ))
          echo "Kill rate: ${KILL_RATE}%"
          if [ "${KILL_RATE}" -lt 65 ]; then
            echo "ERROR: kill rate ${KILL_RATE}% is below the 65% gate."
            exit 1
          fi
          echo "Kill rate gate passed: ${KILL_RATE}%"

  test-pre-release:
    needs: setup
    if: github.event_name != 'pull_request' || needs.setup.outputs.source_changed == 'true'
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.15"
          allow-prereleases: true
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install
        id: install_prerelease
        run: |
          if bash .github/scripts/poetry-install.sh --only main,dev; then
            echo "env_ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Skipping pre-release tests: dependency wheels are not yet available for this interpreter."
            echo "env_ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Lint
        if: steps.install_prerelease.outputs.env_ready == 'true'
        run: poetry -C python run ruff check src tests
      - name: Type-check
        if: steps.install_prerelease.outputs.env_ready == 'true'
        run: echo "Skipping mypy on Python pre-release due to upstream dependency resolution issue; type-checking is enforced in the stable matrix."
      - name: Test
        if: steps.install_prerelease.outputs.env_ready == 'true'
        run: poetry -C python run pytest
      - name: Skip reason
        if: steps.install_prerelease.outputs.env_ready != 'true'
        run: echo "Pre-release environment skipped (missing upstream wheels)."

name: CI R

on:
  push:
    branches: [ main ]
    paths:
      - "r/**"
      - "docs/r.md"
      - ".github/workflows/ci-r.yml"
  pull_request:
    paths:
      - "r/**"
      - "docs/r.md"
      - ".github/workflows/ci-r.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        r-version: ["4.1", "4.3", "release"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev

      - uses: r-lib/actions/setup-r@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          r-version: ${{ matrix.r-version }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@a51a8012b0aab7c32ef9d19bf54da93f3254335e # v2
        with:
          working-directory: r
          extra-packages: any::covr, any::lintr, any::lazyeval

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Run tests
        shell: bash
        run: Rscript -e "library(testthat); testthat::test_dir('r/tests/testthat')"

      - name: Run lintr
        shell: bash
        run: |
          Rscript -e "lints <- lintr::lint_package('r'); n <- length(lints); cat(sprintf('lintr found %d lint(s)\n', n)); if (n > 0) stop(sprintf('lintr quality gate failed: %d lint(s) found', n))"

      - name: Check coverage gate (>=90%)
        shell: bash
        run: |
          Rscript -e "cov <- covr::package_coverage(path='r'); pct <- covr::percent_coverage(cov); cat(sprintf('R coverage: %.1f%%\\n', pct)); if (pct < 90) stop(sprintf('Coverage below 90%% threshold (got %.1f%%)', pct))"

      - name: Build package
        shell: bash
        run: R CMD build r

name: CI R

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "r/**"
      - "docs/r.md"
      - ".github/workflows/ci-r.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  # ─── 1. Cross-platform unit tests (3 OS × 3 R versions = 9 runs) ──────────
  test:
    name: Test (${{ matrix.os }} / R ${{ matrix.r-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        r-version: ["4.1", "4.3", "release"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize Ubuntu apt sources (avoid flaky Chrome mirror)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          r-version: ${{ matrix.r-version }}
          working-directory: r
          dependencies: '"hard"'
          extra-packages: any::testthat, any::lazyeval
          cache: true

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Run tests
        shell: bash
        run: GIVP_R_TEST_PROFILE=quick Rscript -e "library(testthat); testthat::test_dir('r/tests/testthat')"

  # ─── 2. Lint gate — ubuntu/release only, single run ──────────────────────
  lint:
    name: Lint (R)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sanitize Ubuntu apt sources (avoid flaky Chrome mirror)
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::lintr, any::lazyeval
          cache: true

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Run lintr
        shell: bash
        run: |
          Rscript -e "
            lints <- lintr::lint_package('r')
            n     <- length(lints)
            cat(sprintf('lintr found %d lint(s)\n', n))
            if (n > 0) stop(sprintf('lintr quality gate failed: %d lint(s) found', n))
          "

  # ─── 3. Coverage gate — ubuntu/release only, single run ──────────────────
  coverage:
    name: Coverage (R >= 90%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Sanitize Ubuntu apt sources (avoid flaky Chrome mirror)
        shell: bash
        run: |
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::covr, any::lazyeval
          cache: true

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Check coverage gate (>= 90%) and generate report
        shell: bash
        run: |
          GIVP_R_TEST_PROFILE=full Rscript -e "
            cov <- covr::package_coverage(path = 'r')
            pct <- covr::percent_coverage(cov)
            cat(sprintf('R coverage: %.1f%%\n', pct))
            covr::to_cobertura(cov, filename = 'coverage-r.xml')
            if (pct < 90) stop(sprintf('Coverage below 90%% threshold (got %.1f%%)', pct))
          "

      - name: Check patch coverage on PR (>= 90%)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          export PR_BASE_SHA="${{ github.event.pull_request.base.sha }}"
          Rscript - <<'RS'
          threshold <- 90.0
          diff <- system2("git", c("diff", "--unified=0", paste0(Sys.getenv("PR_BASE_SHA"), "...HEAD"), "--", "r/R"), stdout = TRUE)

          changed <- new.env(parent = emptyenv())
          current <- NULL
          for (line in diff) {
            if (startsWith(line, "+++ b/")) {
              current <- substring(line, 7)
              next
            }
            m <- regexec("^@@ -[0-9]+(?:,[0-9]+)? \\+([0-9]+)(?:,([0-9]+))? @@", line, perl = TRUE)
            g <- regmatches(line, m)[[1]]
            if (!is.null(current) && length(g) > 0) {
              start <- as.integer(g[2])
              len <- ifelse(length(g) >= 3 && nzchar(g[3]), as.integer(g[3]), 1L)
              if (len > 0) {
                for (ln in seq.int(start, start + len - 1L)) {
                  changed[[paste0(current, ":", ln)]] <- TRUE
                }
              }
            }
          }

          keys <- ls(changed, all.names = TRUE)
          keys <- keys[startsWith(keys, "r/R/")]
          if (length(keys) == 0) {
            cat("R patch coverage: N/A (no changed lines in r/R)\n")
            quit(status = 0)
          }

          normalize_file <- function(path) {
            p <- gsub("\\\\", "/", path)
            if (startsWith(p, "r/R/")) return(p)
            if (startsWith(p, "R/")) return(paste0("r/", p))
            m <- regexpr("/r/R/", p, fixed = TRUE)
            if (m[1] > 0) return(substring(p, m[1] + 1L))
            m2 <- regexpr("/R/", p, fixed = TRUE)
            if (m2[1] > 0) return(paste0("r", substring(p, m2[1])))
            p
          }

          xml_lines <- readLines("coverage-r.xml", warn = FALSE)
          cov <- new.env(parent = emptyenv())
          file <- NULL
          for (line in xml_lines) {
            cm <- regexec("filename=\"([^\"]+)\"", line, perl = TRUE)
            cg <- regmatches(line, cm)[[1]]
            if (length(cg) > 0) {
              file <- normalize_file(cg[2])
            }
            lm <- regexec("number=\"([0-9]+)\"[^>]*hits=\"([0-9.]+)\"", line, perl = TRUE)
            lg <- regmatches(line, lm)[[1]]
            if (!is.null(file) && length(lg) > 0) {
              key <- paste0(file, ":", as.integer(lg[2]))
              cov[[key]] <- as.integer(floor(as.numeric(lg[3])))
            }
          }

          cov_keys <- ls(cov, all.names = TRUE)
          coverable_keys <- keys[keys %in% cov_keys]
          if (length(coverable_keys) == 0) {
            cat("R patch coverage: N/A (no coverable changed lines in r/R)\n")
            quit(status = 0)
          }

          covered <- sum(vapply(coverable_keys, function(k) {
            v <- cov[[k]]
            !is.null(v) && v > 0
          }, logical(1)))

          total <- length(coverable_keys)
          missing <- length(keys) - length(coverable_keys)
          pct <- covered / total * 100.0
          cat(sprintf("R patch coverage: %.1f%%  (%d / %d coverable changed lines)\n", pct, covered, total))
          if (missing > 0) {
            cat(sprintf("::warning::%d changed lines are non-coverable in coverage-r.xml and were excluded\n", missing))
          }
          if (pct + 1e-9 < threshold) {
            stop(sprintf("::error::R patch coverage below %.1f%% threshold (got %.1f%%)", threshold, pct))
          }
          RS

      - name: Upload to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          files: coverage-r.xml
          flags: r
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.2.8
          fail_ci_if_error: false

  # ─── 4. Build check — gates on all three quality jobs ────────────────────
  build:
    name: Build (R)
    runs-on: ubuntu-latest
    needs: [test, lint, coverage]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::lazyeval, any::DEoptim, any::pso, any::GA, any::cmaes
          cache: true

      - name: Build package
        shell: bash
        run: R CMD build r

  # ─── 5. Fuzz driver — informational, does not block merge ────────────────
  fuzz:
    name: Fuzz (R)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::lazyeval
          cache: true

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Run fuzz driver
        shell: bash
        run: Rscript r/fuzz/fuzz_givp.R --n-trials 50 --seed 42

  # ─── 6. Benchmark smoke — informational, does not block merge ────────────
  benchmark-smoke:
    name: Benchmark smoke (R)
    runs-on: ubuntu-latest
    needs: build
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        shell: bash
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo apt-get install -y \
            cmake \
            libcurl4-openssl-dev \
            libssl-dev \
            libxml2-dev \
            libgit2-dev \
            libuv1-dev \
            pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::lazyeval
          cache: true

      - name: Install package
        shell: bash
        run: R CMD INSTALL r

      - name: Run literature comparison smoke test
        shell: bash
        run: |
          Rscript r/benchmarks/run_literature_comparison.R \
            --n-runs 2 \
            --dims 3 \
            --max-iter 10 \
            --algorithms GIVP-full DE PSO GA CMA-ES SA \
            --output r/benchmarks/ci_smoke_results.json \
            --verbose

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install Python report dependencies
        shell: bash
        run: |
          bash .github/scripts/bootstrap-poetry.sh
          bash .github/scripts/poetry-install.sh --no-root --only main,benchmarks

      - name: Generate canonical benchmark smoke report
        shell: bash
        run: |
          poetry run python python/benchmarks/generate_report.py \
            --input r/benchmarks/ci_smoke_results.json \
            --format markdown \
            --no-plots \
            --output-dir r/benchmarks

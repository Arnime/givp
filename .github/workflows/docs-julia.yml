name: Docs Julia

on:
    push:
        branches: [ main ]
        paths:
            - "julia/src/**"
            - "julia/docs/**"
            - ".github/workflows/docs-julia.yml"
    pull_request:
        paths:
            - "julia/src/**"
            - "julia/docs/**"
            - ".github/workflows/docs-julia.yml"
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    {}

jobs:
    build-pr:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
              with:
                  version: "1"

            - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

            - name: Install docs dependencies
              run: |
                  julia --project=julia/docs -e '
                    using Pkg
                    Pkg.Registry.update()
                    Pkg.instantiate()
                  '

            - name: Build documentation
              run: julia --project=julia/docs julia/docs/make.jl
              env:
                  DOCUMENTER_KEY: ${{ secrets.DOCUMENTER_KEY }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Upload docs artifact (PR preview)
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: julia-docs-preview
                  path: julia/docs/build/
                  retention-days: 14

    build-main:
        if: github.event_name != 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - uses: julia-actions/setup-julia@fa02766e078afaaf09b14210362cee14137e6a32 # v3.0.2
              with:
                  version: "1"

            - uses: julia-actions/cache@a7bed9df697e5d7309d68afe7542a87621a8b6c8 # v3.3.0

            - name: Install docs dependencies
              run: |
                  julia --project=julia/docs -e '
                    using Pkg
                    Pkg.Registry.update()
                    Pkg.instantiate()
                  '

            - name: Build documentation (no deploy)
              run: julia --project=julia/docs julia/docs/make.jl
              env:
                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



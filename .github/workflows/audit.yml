name: Audit

on:
    push:
        branches: [main]
        paths:
            - "poetry.lock"
            - "python/requirements/poetry-bootstrap.txt"
            - "pyproject.toml"
            - ".github/workflows/audit.yml"
    pull_request:
    schedule:
        - cron: "13 5 * * 1"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    POETRY_VIRTUALENVS_CREATE: "false"

permissions:
    contents: read

jobs:
    pip-audit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Bootstrap Poetry
              run: |
                  bash .github/scripts/bootstrap-poetry.sh
            - name: Install scipy build dependencies (3.14)
              if: matrix.python-version == '3.14'
              run: |
                  sudo apt-get update
                  sudo apt-get install -y pkg-config gfortran libopenblas-dev
            - name: Install
              run: |
                  bash .github/scripts/poetry-install.sh --no-root --with dev --with audit
                  bash .github/scripts/install-package-editable.sh
            - name: Audit
              run: |
                  python -m pip freeze --exclude-editable | grep -viE '^(pip|setuptools|wheel)==' > /tmp/audit-reqs.txt
                  python -m pip_audit -r /tmp/audit-reqs.txt

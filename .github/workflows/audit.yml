name: Audit

on:
    push:
        branches: [ main ]
        paths:
            - "python/requirements/**"
            - "pyproject.toml"
            - ".github/workflows/audit.yml"
    pull_request:
    schedule:
        - cron: "13 5 * * 1"

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

jobs:
    pip-audit:
        runs-on: ubuntu-latest
        strategy:
            fail-fast: false
            matrix:
                include:
                    - python-version: "3.10"
                      lockfile: python/requirements/audit-py310.txt
                    - python-version: "3.11"
                      lockfile: python/requirements/audit-py310.txt
                    - python-version: "3.12"
                      lockfile: python/requirements/audit-py310.txt
                    - python-version: "3.13"
                      lockfile: python/requirements/audit.txt
                    - python-version: "3.14"
                      lockfile: python/requirements/audit.txt
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: ${{ matrix.python-version }}
            - name: Install
              run: |
                  python -m pip install --only-binary=:all: --require-hashes -r ${{ matrix.lockfile }}
                  bash .github/scripts/install-package-editable.sh
            - name: Audit
              run: |
                  python -m pip freeze --exclude-editable | grep -viE '^(pip|setuptools|wheel)==' > /tmp/audit-reqs.txt
                  python -m pip_audit -r /tmp/audit-reqs.txt
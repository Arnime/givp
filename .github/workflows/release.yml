name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

jobs:
  build-python:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      # Release tags may predate local composite actions, so keep this external.
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install release deps
        run: bash .github/scripts/poetry-install.sh --no-root --only main,release
      - name: Build package
        working-directory: python
        run: python -m build
      - name: Generate artifact hashes
        id: hash
        run: |
          cd python/dist && echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./python/dist/*
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./python/dist/*.tar.gz ./python/dist/*.whl
      - name: Rename sigstore bundles for Scorecard compatibility
        run: for f in python/dist/*.sigstore.json; do mv "$f" "${f%.json}"; done
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json
      - name: Move sigstore files out of dist
        run: mv python/dist/*.sigstore .
      - name: Upload Python release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-release-artifacts
          path: |
            python/dist
            *.sigstore
            sbom.cdx.json
          if-no-files-found: error

  provenance:
    needs: [combine-release-hashes]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.combine-release-hashes.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ inputs.tag || github.ref_name }}

  release-cpp:
    needs: [build-python]
    uses: ./.github/workflows/release-cpp.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  sync-cpp-registries:
    needs: [attach-release-assets]
    uses: ./.github/workflows/sync-cpp-registries.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}
    secrets: inherit

  publish-rust:
    needs: [attach-release-assets]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/givp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}',
            inputs.tag) || github.ref }}

      # Release tags may predate local composite actions, so keep this external.
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "rust -> target"

      - name: Verify crate version matches tag
        id: crate_version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          CRATE_VERSION="$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')"
          EXPECTED="v${CRATE_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $EXPECTED"
            exit 1
          fi
          echo "version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify crate package
        working-directory: rust
        run: cargo publish --dry-run --locked

      - name: Check whether crate version already exists
        id: crate_exists
        env:
          CRATE_VERSION: ${{ steps.crate_version.outputs.version }}
        run: |
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 \
            --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"

          case "$HTTP_CODE" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} already exists on crates.io; publication will be skipped."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} is not yet published."
              ;;
            403)
              # crates.io may deny GitHub-hosted runner IPs under its data-access
              # policy. Cargo remains the source of truth for publication.
              echo "exists=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::crates.io denied the version lookup (HTTP 403); cargo publish will determine whether the version already exists."
              ;;
            *)
              echo "::error::Unable to check crates.io for givp v${CRATE_VERSION} (HTTP ${HTTP_CODE})."
              head -c 500 /tmp/crates-version.json || true
              exit 1
              ;;
          esac

      - name: Verify crates.io token is configured
        if: steps.crate_exists.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment."
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.crate_exists.outputs.exists != 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee /tmp/cargo-publish.log; then
            echo "givp was published to crates.io."
            exit 0
          fi

          if grep -Eqi 'already (uploaded|exists|published)' /tmp/cargo-publish.log; then
            echo "givp is already published on crates.io; treating the re-run as successful."
            exit 0
          fi

          exit 1

      - name: Confirm crate availability
        if: steps.crate_exists.outputs.exists != 'unknown'
        env:
          CRATE_VERSION: ${{ steps.crate_version.outputs.version }}
        run: |
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          for attempt in $(seq 1 18); do
            HTTP_CODE="$(curl --silent --show-error --location \
              --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "givp v${CRATE_VERSION} is available on crates.io."
              exit 0
            fi
            if [ "$HTTP_CODE" = "403" ]; then
              echo "::warning::crates.io denied confirmation from this runner (HTTP 403); cargo publish completed successfully."
              exit 0
            fi
            echo "Attempt ${attempt}/18: crates.io returned HTTP ${HTTP_CODE}; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::crates.io did not confirm givp v${CRATE_VERSION} after publication."
          head -c 500 /tmp/crates-version.json || true
          exit 1

  build-r:
    needs: [build-python]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.r_hash.outputs.hashes }}
      artifact_name: r-release-artifacts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev libxml2-dev pandoc

      # Release tags may predate local composite actions, so keep this external.
      - uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: release
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          working-directory: r
          extra-packages: any::lazyeval
          cache: true

      - name: Build R package tarball
        id: r_build
        run: |
          R CMD build r
          echo "tarball=$(ls givp_*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Generate R artifact hash
        id: r_hash
        env:
          TARBALL: ${{ steps.r_build.outputs.tarball }}
        run: echo "hashes=$(sha256sum \"$TARBALL\" | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Upload R release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: r-release-artifacts
          path: ${{ steps.r_build.outputs.tarball }}
          if-no-files-found: error

  combine-release-hashes:
    needs: [build-python, release-cpp, build-r]
    runs-on: ubuntu-latest
    outputs:
      hashes: ${{ steps.combine.outputs.hashes }}
    steps:
      - id: combine
        env:
          PYTHON_HASHES: ${{ needs.build-python.outputs.hashes }}
          CPP_HASHES: ${{ needs.release-cpp.outputs.hashes }}
          R_HASHES: ${{ needs.build-r.outputs.hashes }}
        run: |
          set -euo pipefail
          {
            printf '%s' "$PYTHON_HASHES" | base64 --decode
            printf '%s' "$CPP_HASHES" | base64 --decode
            printf '%s' "$R_HASHES" | base64 --decode
          } | base64 -w0 | xargs -I{} echo "hashes={}" >> "$GITHUB_OUTPUT"

  attach-release-assets:
    needs: [build-python, release-cpp, build-r, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Verify required SLSA provenance
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          gh release view "$TAG" --json assets --jq '.assets[].name' \
            | grep -Eq '\.intoto\.jsonl$'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-artifacts
          path: python-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.release-cpp.outputs.artifact_name }}
          path: cpp-assets
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.build-r.outputs.artifact_name }}
          path: r-assets
      - name: Attach all signed release assets
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            python-assets/**
            cpp-assets/**
            r-assets/**

  publish-python:
    needs: [attach-release-assets]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/givp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: python-release-artifacts
      - name: Publish to PyPI (trusted publisher)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: python/dist
          attestations: true

  register-julia:
    needs: [attach-release-assets]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}',
            inputs.tag) || github.ref }}

      - name: Validate Julia version against tag
        id: julia_version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          VERSION="${TAG#v}"
          JULIA_VERSION="$(grep '^version' julia/Project.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')"
          if [ "$VERSION" != "$JULIA_VERSION" ]; then
            echo "::error::Tag $TAG does not match julia/Project.toml version $JULIA_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open/update Julia registration issue and trigger Registrator
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RELEASE_TAG: ${{ steps.julia_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.julia_version.outputs.version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const title = `Register GIVPOptimizer v${version}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
              per_page: 20,
            });
            let issue = search.data.items.find((i) => !i.pull_request);

            const issueBody = [
              "Automated Julia package registration request.",
              "",
              `- Package: GIVPOptimizer`,
              `- Subdirectory: julia`,
              `- Version: ${version}`,
              `- Trigger tag: ${tag}`,
              "",
              "This issue was created by the release workflow.",
            ].join("\n");

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: issueBody,
              });
              issue = created.data;
            }

            const registratorComment = [
              "@JuliaRegistrator register subdir=julia",
              "",
              "Release notes:",
              `- Automated registration for ${tag}.`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: registratorComment,
            });

  verify-r-universe:
    needs: [build-r]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check r-universe published version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          VERSION="${TAG#v}"

          echo "Checking r-universe for givp version ${VERSION}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://arnime.r-universe.dev/givp/json" | grep -q '"Version":"'"${VERSION}"'"'; then
              echo "✓ r-universe published givp ${VERSION}"
              exit 0
            fi
            echo "Attempt ${i}/30: version not visible yet; waiting 20s"
            sleep 20
          done

          echo "::warning::r-universe did not show givp ${VERSION} within the retry window"

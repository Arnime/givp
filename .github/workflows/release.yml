name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.2)"
        required: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/givp
    permissions:
      id-token: write
      contents: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.12"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install release deps
        run: bash .github/scripts/poetry-install.sh --no-root --only main,release
      - name: Build package
        run: python -m build
      - name: Generate artifact hashes
        id: hash
        run: |
          cd dist && echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./dist/*
      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl
      - name: Rename sigstore bundles for Scorecard compatibility
        run: for f in dist/*.sigstore.json; do mv "$f" "${f%.json}"; done
      - name: Generate SBOM (CycloneDX)
        run: cyclonedx-py environment --of JSON -o sbom.cdx.json
      - name: Attach artifacts to release
        uses: ./.github/actions/release-assets
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            sbom.cdx.json
            dist/*
      - name: Move sigstore files out of dist
        run: mv dist/*.sigstore .
      - name: Validate README badge URLs
        run: |
          echo "::group::Checking badge URLs"
          urls=(
            "https://img.shields.io/pypi/v/givp?cacheSeconds=300"
            "https://img.shields.io/pypi/pyversions/givp?cacheSeconds=300"
            "https://img.shields.io/codecov/c/github/Arnime/givp?cacheSeconds=300"
            "https://img.shields.io/ossf-scorecard/github.com/Arnime/givp?cacheSeconds=300"
            "https://www.bestpractices.dev/projects/12627/badge?cacheSeconds=300"
          )
          failed=0
          for url in "${urls[@]}"; do
            code=$(curl -sSL -o /dev/null -w '%{http_code}' --max-time 15 --retry 3 --retry-delay 2 "$url")
            if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then
              echo "✓ $code $url"
            else
              echo "✗ $code $url"
              failed=1
            fi
          done
          echo "::endgroup::"
          if [ "$failed" -eq 1 ]; then
            echo "::warning::One or more badge URLs returned errors. PyPI publish continues but badges may show broken on the PyPI page."
          fi
      - name: Publish to PyPI (trusted publisher)
        # Docker actions cannot run reliably inside a local composite action.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: dist
          attestations: true

  provenance:
    needs: [build-and-publish]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build-and-publish.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ inputs.tag || github.ref_name }}

  publish-rust:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/givp
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}',
            inputs.tag) || github.ref }}

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: Verify crate version matches tag
        id: crate_version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          CRATE_VERSION="$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')"
          EXPECTED="v${CRATE_VERSION}"
          if [ "$TAG" != "$EXPECTED" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version $EXPECTED"
            exit 1
          fi
          echo "version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify crate package
        working-directory: rust
        run: cargo publish --dry-run --locked

      - name: Check whether crate version already exists
        id: crate_exists
        env:
          CRATE_VERSION: ${{ steps.crate_version.outputs.version }}
        run: |
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 \
            --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"

          case "$HTTP_CODE" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} already exists on crates.io; publication will be skipped."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} is not yet published."
              ;;
            *)
              echo "::error::Unable to check crates.io for givp v${CRATE_VERSION} (HTTP ${HTTP_CODE})."
              head -c 500 /tmp/crates-version.json || true
              exit 1
              ;;
          esac

      - name: Verify crates.io token is configured
        if: steps.crate_exists.outputs.exists == 'false'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment."
            exit 1
          fi

      - name: Publish to crates.io
        if: steps.crate_exists.outputs.exists == 'false'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked

      - name: Confirm crate availability
        env:
          CRATE_VERSION: ${{ steps.crate_version.outputs.version }}
        run: |
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          for attempt in $(seq 1 18); do
            HTTP_CODE="$(curl --silent --show-error --location \
              --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "givp v${CRATE_VERSION} is available on crates.io."
              exit 0
            fi
            echo "Attempt ${attempt}/18: crates.io returned HTTP ${HTTP_CODE}; retrying in 10 seconds."
            sleep 10
          done

          echo "::error::crates.io did not confirm givp v${CRATE_VERSION} after publication."
          head -c 500 /tmp/crates-version.json || true
          exit 1

  publish-r:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libssl-dev libxml2-dev pandoc

      - uses: ./.github/actions/setup-r
        with:
          working-directory: r
          extra-packages: any::lazyeval
          cache: true

      - name: Build R package tarball
        id: r_build
        run: |
          R CMD build r
          echo "tarball=$(ls givp_*.tar.gz | head -1)" >> "$GITHUB_OUTPUT"

      - name: Attach R tarball to release
        uses: ./.github/actions/release-assets
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: ${{ steps.r_build.outputs.tarball }}

  register-julia:
    needs: [build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref:
            ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}',
            inputs.tag) || github.ref }}

      - name: Validate Julia version against tag
        id: julia_version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          VERSION="${TAG#v}"
          JULIA_VERSION="$(grep '^version' julia/Project.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')"
          if [ "$VERSION" != "$JULIA_VERSION" ]; then
            echo "::error::Tag $TAG does not match julia/Project.toml version $JULIA_VERSION"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Open/update Julia registration issue and trigger Registrator
        uses: actions/github-script@e15a0a3b0f4e8aa4d7b0f0f2df3af7754a7e9a2c # v8.0.0
        env:
          RELEASE_TAG: ${{ steps.julia_version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.julia_version.outputs.version }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = process.env.RELEASE_TAG;
            const version = process.env.RELEASE_VERSION;
            const title = `Register GIVPOptimizer v${version}`;

            const search = await github.rest.search.issuesAndPullRequests({
              q: `repo:${owner}/${repo} is:issue in:title "${title}"`,
              per_page: 20,
            });
            let issue = search.data.items.find((i) => !i.pull_request);

            const issueBody = [
              "Automated Julia package registration request.",
              "",
              `- Package: GIVPOptimizer`,
              `- Subdirectory: julia`,
              `- Version: ${version}`,
              `- Trigger tag: ${tag}`,
              "",
              "This issue was created by the release workflow.",
            ].join("\n");

            if (!issue) {
              const created = await github.rest.issues.create({
                owner,
                repo,
                title,
                body: issueBody,
              });
              issue = created.data;
            }

            const registratorComment = [
              "@JuliaRegistrator register subdir=julia",
              "",
              "Release notes:",
              `- Automated registration for ${tag}.`,
            ].join("\n");

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issue.number,
              body: registratorComment,
            });

  verify-r-universe:
    needs: [publish-r]
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Check r-universe published version
        env:
          GH_EVENT_NAME: ${{ github.event_name }}
          GH_REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ "$GH_EVENT_NAME" = "workflow_dispatch" ]; then
            TAG="$(echo "$INPUT_TAG" | tr -d '[:space:]')"
          else
            TAG="$(echo "$GH_REF_NAME" | tr -d '[:space:]')"
          fi
          VERSION="${TAG#v}"

          echo "Checking r-universe for givp version ${VERSION}"
          for i in $(seq 1 30); do
            if curl -fsSL "https://arnime.r-universe.dev/givp/json" | grep -q '"Version":"'"${VERSION}"'"'; then
              echo "✓ r-universe published givp ${VERSION}"
              exit 0
            fi
            echo "Attempt ${i}/30: version not visible yet; waiting 20s"
            sleep 20
          done

          echo "::warning::r-universe did not show givp ${VERSION} within the retry window"

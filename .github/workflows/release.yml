name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  context:
    permissions: {contents: read}
    uses: ./.github/workflows/release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  python:
    needs: context
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-python.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  cpp:
    needs: context
    permissions: {contents: read}
    uses: ./.github/workflows/release-cpp.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  r:
    needs: context
    permissions: {contents: read}
    uses: ./.github/workflows/release-r.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  provenance:
    needs: [context, python, cpp, r]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: ./.github/workflows/release-provenance.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      python_hashes: ${{ needs.python.outputs.hashes }}
      cpp_hashes: ${{ needs.cpp.outputs.hashes }}
      r_hashes: ${{ needs.r.outputs.hashes }}
      python_artifact_name: ${{ needs.python.outputs.artifact_name }}
      cpp_artifact_name: ${{ needs.cpp.outputs.artifact_name }}
      r_artifact_name: ${{ needs.r.outputs.artifact_name }}

  publish-python:
    needs: [provenance, python]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/givp
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.python.outputs.artifact_name }}
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          skip-existing: true
          packages-dir: python/dist
          attestations: true

  publish-rust:
    needs: [context, provenance]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-rust.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  register-julia:
    needs: [context, provenance]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/register-julia.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  sync-cpp-registries:
    needs: [context, provenance]
    permissions:
      contents: read
    uses: ./.github/workflows/sync-cpp-registries.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
    secrets:
      REGISTRY_FORK_TOKEN: ${{ secrets.REGISTRY_FORK_TOKEN }}

  verify-r-universe:
    needs: [context, r]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-r-universe.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

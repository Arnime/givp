name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (for example v1.0.1)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  context:
    permissions:
      contents: read
    uses: ./.github/workflows/release-context.yml
    with:
      tag: ${{ inputs.tag || github.ref_name }}

  python:
    needs: context
    permissions:
      attestations: write
      contents: read
      id-token: write
    uses: ./.github/workflows/release-python.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  cpp:
    needs: context
    permissions:
      contents: read
    uses: ./.github/workflows/release-cpp.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  r:
    needs: context
    permissions:
      contents: read
    uses: ./.github/workflows/release-r.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  provenance:
    needs: [context, python, cpp, r]
    permissions:
      actions: read
      contents: write
      id-token: write
    uses: ./.github/workflows/release-provenance.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
      python_hashes: ${{ needs.python.outputs.hashes }}
      cpp_hashes: ${{ needs.cpp.outputs.hashes }}
      r_hashes: ${{ needs.r.outputs.hashes }}
      python_artifact_name: ${{ needs.python.outputs.artifact_name }}
      cpp_artifact_name: ${{ needs.cpp.outputs.artifact_name }}
      r_artifact_name: ${{ needs.r.outputs.artifact_name }}

  publish-python:
    needs: [provenance, python]
    permissions:
      id-token: write
    uses: ./.github/workflows/publish-python.yml
    with:
      artifact_name: ${{ needs.python.outputs.artifact_name }}

  publish-rust:
    needs: [context, provenance]
    permissions:
      contents: read
    uses: ./.github/workflows/publish-rust.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  register-julia:
    needs: [context, provenance]
    permissions:
      contents: read
      issues: write
    uses: ./.github/workflows/register-julia.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

  sync-cpp-registries:
    needs: [context, provenance]
    permissions:
      contents: read
    uses: ./.github/workflows/sync-cpp-registries.yml
    with:
      tag: ${{ needs.context.outputs.tag }}
    secrets: inherit

  verify-r-universe:
    needs: [context, r]
    permissions:
      contents: read
    uses: ./.github/workflows/verify-r-universe.yml
    with:
      tag: ${{ needs.context.outputs.tag }}

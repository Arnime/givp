name: Security Checks

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - "python/pyproject.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "python/src/**"
      - "python/tests/**"
      - "python/pyproject.toml"
      - "python/poetry.lock"
      - "python/requirements/**"
      - ".github/scripts/bootstrap-poetry.sh"
      - ".github/scripts/poetry-install.sh"
      - ".github/workflows/security.yml"
  schedule:
    - cron: "0 3 * * *"

env:
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

jobs:
  bandit:
    name: Bandit scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
      - name: Bootstrap Poetry
        run: |
          bash .github/scripts/bootstrap-poetry.sh
      - name: Install Bandit
        run: bash .github/scripts/poetry-install.sh --no-root --only main,dev
      - name: Run Bandit
        run: poetry -C python run bandit -r src -lll

  semgrep:
    name: Semgrep scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run Semgrep
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        with:
          config: "p/ci"

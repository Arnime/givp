name: Julia TagBot

on:
  issue_comment:
    types: [ created, edited ]
  workflow_dispatch:
    inputs:
      lookback:
        description: "Number of hours to look back for new versions (default: 3)"
        required: false
        default: "3"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  TagBot:
    if: github.event_name == 'workflow_dispatch' || github.actor == 'JuliaTagBot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: JuliaRegistries/TagBot@cded32665b34ca0496d3ac10a67d08ddfc726963 # v1.25.11
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ssh: ${{ secrets.DOCUMENTER_KEY }}
          subdir: julia
          # Monorepo: isolate Julia package tags from global repo tags (v*),
          # which may point to commits predating the julia/ subtree.
          tag_prefix: julia-
          lookback: ${{ github.event.inputs.lookback || '3' }}



name: Fuzz

on:
    schedule:
        - cron: "0 4 * * 1" # every Monday at 04:00 UTC
    workflow_dispatch:

permissions:
  contents: read

jobs:
    fuzzing:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
              with:
                  python-version: "3.12"
            - name: Install package and fuzzers
              run: |
                  bash .github/scripts/bootstrap-poetry.sh
                  bash .github/scripts/poetry-install.sh --only main,fuzz
            - name: Run fuzz target with atheris (Linux CI run)
              run: |
                  poetry -C python run python -m fuzz.atheris -atheris_runs=1000 -atheris_jobs=1
              continue-on-error: true

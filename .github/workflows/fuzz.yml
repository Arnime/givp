name: Fuzz

on:
    schedule:
        - cron: "0 4 * * 1" # every Monday at 04:00 UTC
    workflow_dispatch:

permissions:
  contents: read

jobs:
    fuzzing:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.12"
            - name: Install package and fuzzers
              run: |
                  pip install --require-hashes -r python/requirements/fuzz.txt
                  bash .github/scripts/install-package.sh
            - name: Run fuzz target with atheris (Linux CI run)
              run: |
                  python python/fuzz/fuzz_givp.py -atheris_runs=1000 -atheris_jobs=1
              continue-on-error: true



name: Dry-run crates.io

# Equivalent of TestPyPI for the Rust crate:
# verifies that `cargo publish` would succeed without actually publishing.

on:
  push:
    branches: [ main ]
    paths:
      - 'rust/**'
      - '.github/workflows/dry-run-crates.yml'
  pull_request:
    paths:
      - 'rust/**'
      - '.github/workflows/dry-run-crates.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate expected release tag
        run: |
          VERSION=$(python3 .github/scripts/validate_unified_version.py \
            --root "$GITHUB_WORKSPACE")
          echo "Expected release tag: v${VERSION}"

      - uses: ./.github/actions/setup-rust
        with:
          toolchain: stable

      - name: cargo publish --dry-run
        working-directory: rust
        run: cargo publish --dry-run --locked --allow-dirty

      - name: cargo package (verify tarball)
        working-directory: rust
        run: cargo package --locked --allow-dirty --list

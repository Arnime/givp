name: TestPyPI

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    POETRY_VIRTUALENVS_CREATE: "false"

permissions:
    contents: read
    id-token: write

jobs:
    publish-test:
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/p/givp
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
            - uses: ./.github/actions/setup-python
              with:
                  python-version: "3.12"
            - name: Bootstrap Poetry
              run: |
                  bash .github/scripts/bootstrap-poetry.sh
            - name: Install release deps
              run: bash .github/scripts/poetry-install.sh --no-root --only main,release
            - name: Build
              run: |
                  # Append a .devN suffix derived from commit count so each push uploads
                  # a unique version (TestPyPI rejects duplicates).
                  DEV_SUFFIX=".dev$(git rev-list --count HEAD)"
                  cd python
                  poetry run python -c "import re,pathlib; p=pathlib.Path('pyproject.toml'); s=p.read_text(); p.write_text(re.sub(r'(version\s*=\s*\")([^\"]+)(\")', r'\g<1>\g<2>${DEV_SUFFIX}\g<3>', s, count=1))"
                  poetry run python -m build
            - name: Smoke install
              run: |
                  sh .github/scripts/smoke-install.sh python/dist
                  /tmp/smoke/bin/python -c "import givp; print(givp.__version__)"
            - name: Publish to TestPyPI
              # Docker actions cannot run reliably inside a local composite action.
              uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true
                  packages-dir: python/dist
                  attestations: false

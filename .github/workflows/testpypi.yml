name: TestPyPI

on:
    push:
        branches: [main]
    workflow_dispatch:

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    POETRY_VIRTUALENVS_CREATE: "false"

permissions:
    contents: read
    id-token: write

jobs:
    publish-test:
        runs-on: ubuntu-latest
        environment:
            name: testpypi
            url: https://test.pypi.org/p/givp
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0
            - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
              with:
                  python-version: "3.12"
            - name: Bootstrap Poetry
              run: |
                  bash .github/scripts/bootstrap-poetry.sh
            - name: Install release deps
              run: bash .github/scripts/poetry-install.sh --no-root --only main,release
            - name: Build
              run: |
                  # Append a .devN suffix derived from commit count so each push uploads
                  # a unique version (TestPyPI rejects duplicates).
                  DEV_SUFFIX=".dev$(git rev-list --count HEAD)"
                  poetry run python -c "import re,pathlib; p=pathlib.Path('pyproject.toml'); s=p.read_text(); p.write_text(re.sub(r'(version\s*=\s*\")([^\"]+)(\")', r'\g<1>\g<2>${DEV_SUFFIX}\g<3>', s, count=1))"
                  poetry run python -m build
            - name: Smoke install
              run: |
                  sh .github/scripts/smoke-install.sh
                  /tmp/smoke/bin/python -c "import givp; print(givp.__version__)"
            - name: Publish to TestPyPI
              uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
              with:
                  repository-url: https://test.pypi.org/legacy/
                  skip-existing: true

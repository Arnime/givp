name: Backfill Provenance

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Stable release tag to backfill (e.g. v1.2.3)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  POETRY_VIRTUALENVS_CREATE: "false"

permissions:
  contents: read

concurrency:
  group: provenance-${{ inputs.tag_name || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  check-existing:
    runs-on: ubuntu-latest
    outputs:
      effective_tag: ${{ steps.release.outputs.effective_tag }}
      should_backfill: ${{ steps.release.outputs.should_backfill }}
    steps:
      - id: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          INPUT_TAG: ${{ inputs.tag_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$RELEASE_TAG}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::notice::Provenance fallback applies only to stable vX.Y.Z releases."
            echo "should_backfill=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "effective_tag=$TAG" >> "$GITHUB_OUTPUT"
          for attempt in $(seq 1 12); do
            if gh release view "$TAG" --repo "$GH_REPO" --json assets \
              --jq '.assets[].name' | grep -Eq '\.intoto\.jsonl$'; then
              echo "Provenance already exists for $TAG; no backfill is needed."
              echo "should_backfill=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt ${attempt}/12: provenance is not visible yet; waiting 10 seconds."
            sleep 10
          done
          echo "No provenance asset found for $TAG; starting backfill."
          echo "should_backfill=true" >> "$GITHUB_OUTPUT"

  build:
    needs: check-existing
    if: needs.check-existing.outputs.should_backfill == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      effective_tag: ${{ needs.check-existing.outputs.effective_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Overlay source from the released tag
        env:
          EFFECTIVE_TAG: ${{ needs.check-existing.outputs.effective_tag }}
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --tags origin "refs/tags/$EFFECTIVE_TAG" >/dev/null; then
            echo "::error::Tag '$EFFECTIVE_TAG' was not found on origin. Please use an existing tag like v0.5.4"
            exit 1
          fi

          git fetch --tags --no-recurse-submodules origin "$EFFECTIVE_TAG"

          # Support historical layout changes across tags:
          # - v0.5.1 and earlier: src/givp
          # - v0.5.4 and later:   python/src/givp
          rm -rf python/src src/givp

          if git cat-file -e "$EFFECTIVE_TAG:python/src" 2>/dev/null; then
            echo "Using source layout from tag: python/src"
            git checkout "$EFFECTIVE_TAG" -- python/src pyproject.toml
          elif git cat-file -e "$EFFECTIVE_TAG:src/givp" 2>/dev/null; then
            echo "Using source layout from tag: src/givp"
            git checkout "$EFFECTIVE_TAG" -- src/givp pyproject.toml
          else
            echo "::error::Unsupported source layout in tag $EFFECTIVE_TAG (expected python/src or src/givp)"
            exit 1
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          bash .github/scripts/bootstrap-poetry.sh
          if bash .github/scripts/poetry-install.sh --no-root --only main,release; then
            poetry run python -m build
          else
            echo "::warning::Poetry could not install the historical release dependencies; building with PEP 517 instead."
            python -m build
          fi

      - name: Generate artifact hashes
        id: hash
        run: cd dist && echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ./dist/*

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Rename sigstore bundles for Scorecard compatibility
        run: for f in dist/*.sigstore.json; do mv "$f" "${f%.json}"; done

      - name: Attach sigstore files to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.check-existing.outputs.effective_tag }}
          files: dist/*.sigstore

      - name: Upload dist for SLSA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-backfill
          path: dist/
          retention-days: 1

  provenance:
    needs: [check-existing, build]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.check-existing.outputs.effective_tag }}

  verify-provenance:
    needs: [check-existing, build, provenance]
    runs-on: ubuntu-latest
    if: ${{ always() && needs.check-existing.outputs.should_backfill == 'true' }}
    permissions:
      contents: read
    steps:
      - name: Verify provenance asset is attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_NAME: ${{ needs.build.outputs.effective_tag }}
        run: |
          set -euo pipefail

          # gh may run outside a git checkout; GH_REPO forces repository context.
          for attempt in $(seq 1 12); do
            mapfile -t assets < <(
              gh release view "$TAG_NAME" --repo "$GH_REPO" --json assets \
                --jq '.assets[].name' | grep -E '\.intoto\.jsonl$' || true
            )

            if [ "${#assets[@]}" -gt 0 ]; then
              echo "Provenance asset(s) found on $TAG_NAME:"
              printf ' - %s\n' "${assets[@]}"
              exit 0
            fi

            echo "Attempt ${attempt}/12: no .intoto.jsonl asset on $TAG_NAME yet; waiting 10s..."
            sleep 10
          done

          echo "::error::No provenance .intoto.jsonl asset found on release $TAG_NAME after retries"
          exit 1

name: Backfill Provenance

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag to backfill (e.g. v1.2.3)"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# "Break-glass" workflow: rebuilds a release from its tagged source,
# re-signs with Sigstore, attaches .sigstore files to the existing GitHub
# release, and generates SLSA provenance (multiple.intoto.jsonl).
#
# Use this when the release.yml provenance job failed or the release was
# published before SLSA provenance was added to the pipeline.
#
# Usage: Actions -> Backfill Provenance -> Run workflow -> enter tag name
# ---------------------------------------------------------------------------

jobs:

  build:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
      attestations: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
      effective_tag: ${{ steps.overlay.outputs.effective_tag }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          persist-credentials: false

      - name: Overlay source from ${{ inputs.tag_name }}
        id: overlay
        env:
          TAG_NAME: ${{ inputs.tag_name }}
        run: |
          set -euo pipefail

          RAW_TAG="$(echo "$TAG_NAME" | tr -d '[:space:]')"
          EFFECTIVE_TAG="$RAW_TAG"

          # Accept common typo "v.X.Y.Z" by normalizing to "vX.Y.Z".
          if [[ "$RAW_TAG" =~ ^v\.[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            EFFECTIVE_TAG="v${RAW_TAG#v.}"
            echo "Normalizing tag input '$RAW_TAG' -> '$EFFECTIVE_TAG'"
          fi

          echo "effective_tag=$EFFECTIVE_TAG" >> "$GITHUB_OUTPUT"

          if ! git ls-remote --exit-code --tags origin "refs/tags/$EFFECTIVE_TAG" >/dev/null; then
            echo "::error::Tag '$EFFECTIVE_TAG' was not found on origin. Please use an existing tag like v0.5.4"
            exit 1
          fi

          git fetch --tags --no-recurse-submodules origin "$EFFECTIVE_TAG"

          # Support historical layout changes across tags:
          # - v0.5.1 and earlier: src/givp
          # - v0.5.4 and later:   python/src/givp
          rm -rf python/src src/givp

          if git cat-file -e "$EFFECTIVE_TAG:python/src" 2>/dev/null; then
            echo "Using source layout from tag: python/src"
            git checkout "$EFFECTIVE_TAG" -- python/src pyproject.toml
          elif git cat-file -e "$EFFECTIVE_TAG:src/givp" 2>/dev/null; then
            echo "Using source layout from tag: src/givp"
            git checkout "$EFFECTIVE_TAG" -- src/givp pyproject.toml
          else
            echo "::error::Unsupported source layout in tag $EFFECTIVE_TAG (expected python/src or src/givp)"
            exit 1
          fi

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build
        run: |
          pip install --only-binary=:all: --require-hashes -r python/requirements/release-tools.txt
          python -m build

      - name: Generate artifact hashes
        id: hash
        run: cd dist && echo "hashes=$(sha256sum -- * | base64 -w0)" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@a2bbfa25375fe432b6a289bc6b6cd05ecd0c4c32 # v4.1.0
        with:
          subject-path: ./dist/*

      - name: Sign artifacts with Sigstore
        uses: sigstore/gh-action-sigstore-python@04cffa1d795717b140764e8b640de88853c92acc # v3.3.0
        with:
          inputs: ./dist/*.tar.gz ./dist/*.whl

      - name: Rename sigstore bundles for Scorecard compatibility
        run: for f in dist/*.sigstore.json; do mv "$f" "${f%.json}"; done

      - name: Attach sigstore files to release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ steps.overlay.outputs.effective_tag }}
          files: dist/*.sigstore

      - name: Upload dist for SLSA
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-backfill
          path: dist/
          retention-days: 1

      - name: Remove existing provenance assets from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ steps.overlay.outputs.effective_tag }}
        run: |
          set -euo pipefail
          mapfile -t assets < <(
            gh release view "$TAG_NAME" --json assets \
              --jq '.assets[].name' | grep -E '\.intoto\.jsonl$' || true
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No existing provenance assets to remove for $TAG_NAME"
            exit 0
          fi

          for asset in "${assets[@]}"; do
            echo "Deleting existing provenance asset: $asset"
            gh release delete-asset "$TAG_NAME" "$asset" --yes
          done

  provenance:
    needs: [ build ]
    permissions:
      actions: read
      id-token: write
      contents: write
    # slsa-framework/slsa-github-generator is exempt from hash-pinning per Scorecard policy
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@f7dd8c54c2067bafc12ca7a55595d5ee9b75204a # v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"
      upload-assets: true
      upload-tag-name: ${{ needs.build.outputs.effective_tag }}
      continue-on-error: true

  verify-provenance:
    needs: [ build, provenance ]
    runs-on: ubuntu-latest
    if: ${{ always() }}
    permissions:
      contents: read
    steps:
      - name: Verify provenance asset is attached to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.build.outputs.effective_tag }}
        run: |
          set -euo pipefail

          mapfile -t assets < <(
            gh release view "$TAG_NAME" --json assets \
              --jq '.assets[].name' | grep -E '\.intoto\.jsonl$' || true
          )

          if [ "${#assets[@]}" -eq 0 ]; then
            echo "::error::No provenance .intoto.jsonl asset found on release $TAG_NAME"
            exit 1
          fi

          echo "Provenance asset(s) found on $TAG_NAME:"
          printf ' - %s\n' "${assets[@]}"



name: Publish Rust to crates.io

# Automatically publishes the Rust crate to crates.io when a tag matching v*.*.* is pushed.
# Also supports manual dispatch with optional publish.
# Prerequisites:
#   - Set CARGO_REGISTRY_TOKEN as a repository secret in Settings > Secrets and variables > Actions
#     (obtain from https://crates.io/me after logging in)

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish to crates.io (false = dry-run only)"
        required: true
        default: false
        type: boolean
      expected_version:
        description: "Optional Cargo.toml version to validate (e.g. 1.0.0 or v1.0.0)"
        required: false
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/givp
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: "rust -> target"

      - name: Determine version context
        id: version
        working-directory: rust
        run: |
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | cut -d'"' -f2)
          echo "version=${CARGO_VERSION}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            TAG_VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "tag_version=${TAG_VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=" >> "$GITHUB_OUTPUT"
            echo "tag_version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate version (tag push)
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          CARGO_VERSION="${{ steps.version.outputs.version }}"
          TAG_VERSION="${{ steps.version.outputs.tag_version }}"
          if [ "$CARGO_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✓ Version check passed: $CARGO_VERSION"

      - name: Validate version (manual expected_version)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_version != '' }}
        env:
          CARGO_VERSION: ${{ steps.version.outputs.version }}
          EXPECTED_VERSION: ${{ inputs.expected_version }}
        run: |
          EXPECTED_RAW="$(echo "$EXPECTED_VERSION" | tr -d '[:space:]')"
          EXPECTED_NORMALIZED="${EXPECTED_RAW#v}"
          if [ "$CARGO_VERSION" != "$EXPECTED_NORMALIZED" ]; then
            echo "ERROR: Cargo.toml version ($CARGO_VERSION) does not match expected_version ($EXPECTED_VERSION)"
            exit 1
          fi
          echo "✓ Manual expected_version check passed: $CARGO_VERSION"

      - name: cargo publish --dry-run (verify before publishing)
        working-directory: rust
        run: cargo publish --dry-run --locked

      - name: Ensure CARGO_REGISTRY_TOKEN exists
        if: ${{ github.event_name == 'push' || inputs.publish }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "ERROR: Repository secret CARGO_REGISTRY_TOKEN is not configured"
            exit 1
          fi

      - name: cargo publish
        if: ${{ github.event_name == 'push' || inputs.publish }}
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --token "$CARGO_REGISTRY_TOKEN"

      - name: Wait for crates.io to sync
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          echo "Waiting 90 seconds for crates.io registry to sync..."
          sleep 90

      - name: Verify publish on crates.io
        if: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          PUBLISHED_VERSION=${{ steps.version.outputs.version }}
          URL="https://crates.io/api/v1/crates/givp/${PUBLISHED_VERSION}"
          UA="givp-ci-publish-check (GitHub Actions; repo=Arnime/grasp_ils_vnd_pr)"

          # crates.io may briefly return 403/404 while metadata propagates.
          for attempt in $(seq 1 36); do
            HTTP_CODE=$(curl -sS -o /tmp/crates_response.json -w "%{http_code}" \
              -H "Accept: application/json" \
              -H "User-Agent: ${UA}" \
              "$URL")

            if [ "$HTTP_CODE" = "200" ]; then
              echo "✓ Successfully published v${PUBLISHED_VERSION} to crates.io"
              exit 0
            fi

            if [ "$HTTP_CODE" = "403" ] || [ "$HTTP_CODE" = "404" ] || [ "$HTTP_CODE" = "429" ] || [ "$HTTP_CODE" -ge 500 ]; then
              echo "Attempt ${attempt}/36: crates.io returned HTTP ${HTTP_CODE}; waiting 10s before retry..."
              sleep 10
              continue
            fi

            echo "ERROR: unexpected crates.io HTTP status: ${HTTP_CODE}"
            head -c 500 /tmp/crates_response.json || true
            echo
            exit 1
          done

          echo "ERROR: crates.io did not confirm v${PUBLISHED_VERSION} after retries"
          head -c 500 /tmp/crates_response.json || true
          echo
          exit 1

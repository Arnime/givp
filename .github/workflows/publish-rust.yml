name: Publish Rust Release

on:
  workflow_call:
    inputs:
      tag:
        description: "Validated release tag"
        required: true
        type: string

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: crates-io
      url: https://crates.io/crates/givp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "rust -> target"
      - name: Verify crate version matches tag
        id: version
        env:
          TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          CRATE_VERSION="$(grep '^version' rust/Cargo.toml | head -1 | sed 's/.*= *"\(.*\)"/\1/' | tr -d '[:space:]')"
          if [ "$TAG" != "v${CRATE_VERSION}" ]; then
            echo "::error::Tag $TAG does not match Cargo.toml version v${CRATE_VERSION}."
            exit 1
          fi
          echo "version=$CRATE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify crate package
        working-directory: rust
        run: cargo publish --dry-run --locked
      - name: Check whether crate version already exists
        id: exists
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          HTTP_CODE="$(curl --silent --show-error --location --retry 3 \
            --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"
          case "$HTTP_CODE" in
            200)
              echo "exists=true" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} already exists on crates.io; publication will be skipped."
              ;;
            404)
              echo "exists=false" >> "$GITHUB_OUTPUT"
              echo "givp v${CRATE_VERSION} is not yet published."
              ;;
            403)
              echo "exists=unknown" >> "$GITHUB_OUTPUT"
              echo "::warning::crates.io denied the version lookup; cargo publish will determine availability."
              ;;
            *)
              echo "::error::Unable to check crates.io for givp v${CRATE_VERSION} (HTTP ${HTTP_CODE})."
              head -c 500 /tmp/crates-version.json || true
              exit 1
              ;;
          esac
      - name: Verify crates.io token is configured
        if: steps.exists.outputs.exists != 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not configured in the crates-io environment."
            exit 1
          fi
      - name: Publish to crates.io
        if: steps.exists.outputs.exists != 'true'
        working-directory: rust
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        shell: bash
        run: |
          set -o pipefail
          if cargo publish --locked 2>&1 | tee /tmp/cargo-publish.log; then
            echo "givp was published to crates.io."
            exit 0
          fi
          if grep -Eqi 'already (uploaded|exists|published)' /tmp/cargo-publish.log; then
            echo "givp is already published on crates.io; treating the re-run as successful."
            exit 0
          fi
          exit 1
      - name: Confirm crate availability
        if: steps.exists.outputs.exists != 'unknown'
        env:
          CRATE_VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          URL="https://crates.io/api/v1/crates/givp/${CRATE_VERSION}"
          for attempt in $(seq 1 18); do
            HTTP_CODE="$(curl --silent --show-error --location \
              --output /tmp/crates-version.json --write-out '%{http_code}' "$URL")"
            if [ "$HTTP_CODE" = "200" ]; then
              echo "givp v${CRATE_VERSION} is available on crates.io."
              exit 0
            fi
            if [ "$HTTP_CODE" = "403" ]; then
              echo "::warning::crates.io denied confirmation; cargo publish completed successfully."
              exit 0
            fi
            echo "Attempt ${attempt}/18: crates.io returned HTTP ${HTTP_CODE}; retrying in 10 seconds."
            sleep 10
          done
          echo "::error::crates.io did not confirm givp v${CRATE_VERSION} after publication."
          head -c 500 /tmp/crates-version.json || true
          exit 1

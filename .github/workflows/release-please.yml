name: Auto Tag on Version Bump

# Cria automaticamente uma tag vX.Y.Z sempre que a versão dos manifests
# principais mudar na branch main, disparando assim o workflow Release
# (release.yml), que também publica no crates.io.

on:
    push:
        branches: [ main ]
        paths:
            - python/pyproject.toml
            - julia/Project.toml
            - rust/Cargo.toml
            - r/DESCRIPTION
            - cpp/CMakeLists.txt

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
    contents: read

jobs:
    auto-tag:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0

            - name: Read and validate unified version
              id: version
              run: |
                  VERSION=$(python3 .github/scripts/validate_unified_version.py \
                    --root "$GITHUB_WORKSPACE")
                  echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Detected version: v${VERSION}"

            - name: Check if tag already exists
              id: tag_check
              run: |
                  if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "Tag ${{ steps.version.outputs.tag }} does not exist — will create."
                  fi

            - name: Create and push tag
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${{ steps.version.outputs.tag }}"
                  git push origin "${{ steps.version.outputs.tag }}"
                  echo "Tag ${{ steps.version.outputs.tag }} created and pushed."

            - name: Note release trigger
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  echo "Tag ${{ steps.version.outputs.tag }} pushed — release.yml triggered automatically via push:tags event."

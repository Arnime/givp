name: Auto Tag on Version Bump

# Cria automaticamente uma tag vX.Y.Z sempre que a versão dos manifests
# principais mudar na branch main, disparando assim o workflow Release
# (release.yml), que também publica no crates.io.

on:
    push:
        branches: [ main ]
        paths:
            - pyproject.toml
            - julia/Project.toml
            - rust/Cargo.toml
            - r/DESCRIPTION
            - cpp/CMakeLists.txt

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

jobs:
    auto-tag:
        runs-on: ubuntu-latest
        permissions:
            contents: write
            actions: write
        steps:
            - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
              with:
                  fetch-depth: 0

            - name: Read and validate unified version
              id: version
              run: |
                  VERSION=$(python3 - <<'PY'
                  import pathlib
                  import re
                  import tomllib

                  root = pathlib.Path('.')

                  py = tomllib.load((root / 'pyproject.toml').open('rb'))['project']['version']
                  jl = tomllib.load((root / 'julia' / 'Project.toml').open('rb'))['version']

                  cargo_text = (root / 'rust' / 'Cargo.toml').read_text(encoding='utf-8')
                  cargo_match = re.search(r'^version\s*=\s*"([^"]+)"', cargo_text, re.M)
                  if not cargo_match:
                      raise SystemExit('Unable to read version from rust/Cargo.toml')
                  rs = cargo_match.group(1)

                  r_desc = (root / 'r' / 'DESCRIPTION').read_text(encoding='utf-8')
                  r_match = re.search(r'^Version:\s*([0-9A-Za-z.+-]+)\s*$', r_desc, re.M)
                  if not r_match:
                      raise SystemExit('Unable to read version from r/DESCRIPTION')
                  r_ver = r_match.group(1)

                  cmake = (root / 'cpp' / 'CMakeLists.txt').read_text(encoding='utf-8')
                  cpp_match = re.search(r'project\(\s*givp\s+VERSION\s+([0-9A-Za-z.+-]+)', cmake)
                  if not cpp_match:
                      raise SystemExit('Unable to read version from cpp/CMakeLists.txt')
                  cpp_ver = cpp_match.group(1)

                  versions = {
                      'pyproject.toml': py,
                      'julia/Project.toml': jl,
                      'rust/Cargo.toml': rs,
                      'r/DESCRIPTION': r_ver,
                      'cpp/CMakeLists.txt': cpp_ver,
                  }

                  unique = sorted(set(versions.values()))
                  if len(unique) != 1:
                      details = '\n'.join(f'  - {k}: {v}' for k, v in versions.items())
                      raise SystemExit(
                          'Version mismatch across manifests. Bump all language manifests to the same version.\n'
                          + details
                      )

                  print(unique[0])
                  PY
                  )
                  echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
                  echo "Detected version: v${VERSION}"

            - name: Check if tag already exists
              id: tag_check
              run: |
                  if git ls-remote --tags origin "${{ steps.version.outputs.tag }}" | grep -q .; then
                      echo "exists=true" >> "$GITHUB_OUTPUT"
                      echo "Tag ${{ steps.version.outputs.tag }} already exists — skipping."
                  else
                      echo "exists=false" >> "$GITHUB_OUTPUT"
                      echo "Tag ${{ steps.version.outputs.tag }} does not exist — will create."
                  fi

            - name: Create and push tag
              if: steps.tag_check.outputs.exists == 'false'
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git tag "${{ steps.version.outputs.tag }}"
                  git push origin "${{ steps.version.outputs.tag }}"
                  echo "Tag ${{ steps.version.outputs.tag }} created and pushed."

            - name: Trigger release workflow
              if: steps.tag_check.outputs.exists == 'false'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  gh workflow run release.yml \
                    --repo "${{ github.repository }}" \
                    --field tag="${{ steps.version.outputs.tag }}"
                  echo "Release workflow dispatched for ${{ steps.version.outputs.tag }}."



name: CI C++

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "cpp/**"
      - "!cpp/**/*.md"
      - ".github/workflows/ci-cpp.yml"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CMAKE_BUILD_PARALLEL_LEVEL: "4"

permissions:
  contents: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      toolchains: ${{ steps.pick.outputs.toolchains }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - id: pick
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if git diff --name-only "$PR_BASE" HEAD -- cpp/include cpp/tests cpp/benchmarks | grep -q .; then
              echo 'toolchains=[{"os":"ubuntu-latest","compiler":"gcc","cc":"gcc","cxx":"g++"},{"os":"ubuntu-latest","compiler":"clang","cc":"clang","cxx":"clang++"},{"os":"windows-latest","compiler":"msvc","cc":"cl","cxx":"cl"},{"os":"macos-latest","compiler":"clang","cc":"clang","cxx":"clang++"}]' >> "$GITHUB_OUTPUT"
            else
              echo 'toolchains=[{"os":"ubuntu-latest","compiler":"gcc","cc":"gcc","cxx":"g++"}]' >> "$GITHUB_OUTPUT"
            fi
          else
            echo 'toolchains=[{"os":"ubuntu-latest","compiler":"gcc","cc":"gcc","cxx":"g++"},{"os":"ubuntu-latest","compiler":"clang","cc":"clang","cxx":"clang++"},{"os":"windows-latest","compiler":"msvc","cc":"cl","cxx":"cl"},{"os":"macos-latest","compiler":"clang","cc":"clang","cxx":"clang++"}]' >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install clang tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy-18 clang-format-18

      - name: Check formatting (clang-format)
        run: |
          {
            find cpp/include -type f \( -name '*.hpp' -o -name '*.h' \) -print0
            find cpp/tests -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0
            find cpp/benchmarks -type f \( -name '*.cpp' -o -name '*.hpp' -o -name '*.h' \) -print0
          } | xargs -0 -r clang-format-18 --dry-run --Werror

      - name: Configure compile database
        run: |
          cmake -S cpp -B cpp/build/tidy \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DGIVP_BUILD_TESTS=ON \
            -DGIVP_BUILD_BENCHMARKS=ON \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          find cpp/tests cpp/benchmarks -type f -name '*.cpp' -print0 \
            | xargs -0 -r -n 1 clang-tidy-18 -p cpp/build/tidy \
                --header-filter='cpp/include/.*' \
                --warnings-as-errors='*'

  test:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.toolchains) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set compiler (non-Windows)
        if: matrix.compiler != 'msvc'
        run: |
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      # Single-config generators (Makefile/Ninja on Linux/macOS) use
      # CMAKE_BUILD_TYPE at configure time; multi-config (MSVC) needs
      # --config at build/test time.
      - name: Configure
        run: >
          cmake -S cpp -B cpp/build/default ${{ matrix.compiler == 'msvc' && '' ||
          '-DCMAKE_BUILD_TYPE=Release' }} -DGIVP_BUILD_TESTS=ON
          -DGIVP_BUILD_BENCHMARKS=OFF

      - name: Build
        run:
          cmake --build cpp/build/default ${{ matrix.compiler == 'msvc' && '--config Release' ||
          '' }}

      - name: Test
        run: >
          ctest --test-dir cpp/build/default --output-on-failure ${{ matrix.compiler ==
          'msvc' && '-C Release' || '' }}

  consumer:
    needs: setup
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.setup.outputs.toolchains) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set compiler (non-Windows)
        if: matrix.compiler != 'msvc'
        run: |
          echo "CC=${{ matrix.cc }}"   >> "$GITHUB_ENV"
          echo "CXX=${{ matrix.cxx }}" >> "$GITHUB_ENV"

      - name: Configure package build
        run: >
          cmake -S cpp -B cpp/build/package ${{ matrix.compiler == 'msvc' && '' ||
          '-DCMAKE_BUILD_TYPE=Release' }} -DGIVP_BUILD_TESTS=OFF
          -DGIVP_BUILD_BENCHMARKS=OFF -DGIVP_BUILD_FUZZ=OFF

      - name: Build package
        run:
          cmake --build cpp/build/package ${{ matrix.compiler == 'msvc' && '--config Release' ||
          '' }}

      - name: Install package
        run: >
          cmake --install cpp/build/package --prefix cpp/build/install ${{ matrix.compiler ==
          'msvc' && '--config Release' || '' }}

      - name: Create consumer project
        shell: bash
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.21)
          project(givp_consumer LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)

          find_package(givp CONFIG REQUIRED)

          add_executable(givp_consumer main.cpp)
          target_link_libraries(givp_consumer PRIVATE givp::givp)
          EOF

          cat > consumer/main.cpp <<'EOF'
          #include <cmath>
          #include <vector>

          #include <givp/givp.hpp>

          int main() {
              auto sphere = [](const std::vector<double> &x) {
                  double s = 0.0;
                  for (double v : x) {
                      s += v * v;
                  }
                  return s;
              };

              std::vector<std::pair<double, double>> bounds(3, {-5.0, 5.0});
              givp::GivpConfig cfg;
              cfg.max_iterations = 10;
              cfg.seed = 7;

              auto result = givp::givp(sphere, bounds, cfg);
              return (result.success && std::isfinite(result.fun)) ? 0 : 1;
          }
          EOF

      - name: Configure consumer
        run: >
          cmake -S consumer -B cpp/build/consumer ${{ matrix.compiler == 'msvc' && '' ||
          '-DCMAKE_BUILD_TYPE=Release' }} -DCMAKE_PREFIX_PATH=${{ github.workspace }}/cpp/build/install

      - name: Build consumer
        run:
          cmake --build cpp/build/consumer ${{ matrix.compiler == 'msvc' && '--config Release' ||
          '' }}

      - name: Run consumer
        shell: bash
        run: |
          if [ -x cpp/build/consumer/givp_consumer ]; then
            ./cpp/build/consumer/givp_consumer
          elif [ -x cpp/build/consumer/Release/givp_consumer.exe ]; then
            ./cpp/build/consumer/Release/givp_consumer.exe
          else
            echo "::error::Consumer binary not found"
            find cpp/build/consumer -maxdepth 3 -type f
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install lcov
        run: sudo apt-get install -y lcov

      - name: Configure (coverage build)
        run: >
          cmake -S cpp -B cpp/build/coverage -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="--coverage" -DCMAKE_EXE_LINKER_FLAGS="--coverage"
          -DGIVP_BUILD_TESTS=ON -DGIVP_BUILD_BENCHMARKS=OFF

      - name: Build
        run: cmake --build cpp/build/coverage -- -j4

      - name: Run tests
        run: ctest --test-dir cpp/build/coverage --output-on-failure

      - name: Collect coverage
        run: |
          lcov --capture \
            --directory cpp/build/coverage \
               --output-file coverage_raw.info \
               --gcov-tool gcov \
            --ignore-errors source,gcov,negative \
               --rc geninfo_unexecuted_blocks=1
          lcov --remove coverage_raw.info \
            '*/cpp/build/coverage/_deps/*' \
               '/usr/*' \
               --output-file coverage.info \
            --ignore-errors source,negative
          lcov --list coverage.info

      - name: Check coverage gate (≥90%)
        run: |
          hit=$(grep '^LH:' coverage.info | awk -F: '{s+=$2} END {print s+0}')
          total=$(grep '^LF:' coverage.info | awk -F: '{s+=$2} END {print s+0}')
          if [ "$total" -eq 0 ]; then
            echo "::error::No coverage data found in coverage.info"
            exit 1
          fi
          pct=$(awk "BEGIN {printf \"%.1f\", $hit / $total * 100}")
          echo "C++ coverage: ${pct}%  ($hit / $total lines)"
          awk "BEGIN { if ($hit / $total * 100 < 90.0) { print \"::error::Coverage below 90% threshold (got ${pct}%)\"; exit 1 } }"

      - name: Check patch coverage on PR (>= 90%)
        if: github.event_name == 'pull_request'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          CHANGED_FILE="$(mktemp)"

          git diff --unified=0 "$BASE_SHA...HEAD" -- cpp/include | awk '
            /^\+\+\+ b\// {f=substr($0,7); next}
            /^@@ / {
              if (f == "") next
              if (match($0, /\+([0-9]+)(,([0-9]+))?/, a)) {
                s = a[1] + 0
                n = (a[3] == "" ? 1 : a[3] + 0)
                for (i = 0; i < n; i++) print f ":" (s + i)
              }
            }
          ' | sort -u > "$CHANGED_FILE"

          if [ ! -s "$CHANGED_FILE" ]; then
            echo "C++ patch coverage: N/A (no changed lines in cpp/include)"
            exit 0
          fi

          awk -v changed_file="$CHANGED_FILE" -v threshold="90.0" '
            BEGIN {
              while ((getline l < changed_file) > 0) {
                changed[l] = 1
                total++
              }
              close(changed_file)
            }
            /^SF:/ {
              file = substr($0, 4)
              sub(/^.*\/givp\//, "", file)
              sub(/^\.\//, "", file)
              next
            }
            /^DA:/ {
              split(substr($0, 4), a, ",")
              key = file ":" a[1]
              if (key in changed) {
                seen[key] = 1
                if ((a[2] + 0) > 0) covered++
              }
            }
            END {
              coverable = 0
              for (k in changed) if (k in seen) coverable++
              if (coverable == 0) {
                print "C++ patch coverage: N/A (no coverable changed lines in cpp/include)"
                exit 0
              }
              missing = total - coverable
              pct = (covered / coverable) * 100.0
              printf("C++ patch coverage: %.1f%%  (%d / %d coverable changed lines)\n", pct, covered, coverable)
              if (missing > 0) {
                printf("::warning::%d changed lines are non-coverable in lcov and were excluded\n", missing)
              }
              if (pct + 1e-9 < threshold) {
                printf("::error::C++ patch coverage below %.1f%% threshold (got %.1f%%)\n", threshold, pct)
                exit 1
              }
            }
          ' coverage.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6
        with:
          files: coverage.info
          flags: cpp
          token: ${{ secrets.CODECOV_TOKEN }}
          version: v11.2.8
          fail_ci_if_error: false

  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Configure
        run: >
          cmake -S cpp -B cpp/build/benchmarks -DCMAKE_BUILD_TYPE=Release
          -DGIVP_BUILD_TESTS=OFF -DGIVP_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build cpp/build/benchmarks -- -j4

      - name: Run benchmarks (smoke)
        run: ./cpp/build/benchmarks/benchmarks/givp_benchmarks

      - name: Build literature comparison benchmark
        run: cmake --build cpp/build/benchmarks --target givp_literature_comparison -- -j4

      - name: Run literature comparison smoke test
        run: |
          ./cpp/build/benchmarks/benchmarks/givp_literature_comparison \
            --n-runs 2 \
            --dims 3 \
            --max-iter 10 \
            --time-limit 2 \
            --algorithms GIVP-full DE PSO GA CMA-ES SA \
            --output cpp/benchmarks/ci_smoke_results.json

      - name: Install Python report dependencies
        run: |
          pip install --only-binary=:all: --require-hashes -r python/requirements/benchmarks.txt

      - name: Generate canonical benchmark smoke report
        run: |
          python python/benchmarks/generate_report.py \
            --input cpp/benchmarks/ci_smoke_results.json \
            --format markdown \
            --no-plots \
            --output-dir cpp/benchmarks

  conan-validate:
    name: Validate Conan Recipe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Install Conan
        run: |
          pip install --only-binary=:all: --require-hashes -r cpp/requirements/conan.txt

      - name: Detect default profile
        run: conan profile detect --force

      - name: Create package from local source
        env:
          GIVP_VERSION: "0.0.0-ci"
        run: |
          conan create cpp/conan \
            --version 0.0.0-ci \
            --build=missing \
            -s build_type=Release
        # Runs export_sources + cmake install; validates the recipe end-to-end
        # without requiring a published GitHub release.

  vcpkg-lint:
    name: Lint vcpkg Port Manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git --depth=1 /tmp/vcpkg
          /tmp/vcpkg/bootstrap-vcpkg.sh -disableMetrics

      - name: Validate port manifest JSON (format-manifest)
        run: |
          /tmp/vcpkg/vcpkg format-manifest cpp/vcpkg_ports/arnime-givp/vcpkg.json
          echo "✅ vcpkg.json is valid and correctly formatted."

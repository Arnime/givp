sonar.projectKey=Arnime_grasp_ils_vnd_pr
sonar.organization=arnime
sonar.projectName=givp
sonar.sources=python/src,rust/src,cpp/include,cpp/sonar
sonar.tests=python/tests,rust/tests,cpp/tests

# Keep analysis focused on production code and unit tests.
# __pycache__ / .pyc are compiled artefacts generated by pytest — not source.
sonar.exclusions=**/cpp/build/**,**/builds/**,build-sonar/**,**/target/**,**/.venv/**,**/.julia-env/**,**/Notebooks/**,**/*.ipynb,**/docs/**,**/site/**,**/__pycache__/**,**/*.pyc
sonar.test.exclusions=**/fuzz/**,**/benchmarks/**,**/examples/**

# CLI entry points and Sonar technical translation units are excluded from coverage.
sonar.coverage.exclusions=rust/src/bin/**,cpp/sonar/**,cpp/include/**

# Optional coverage imports (scanner skips missing files).
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage-python.xml
sonar.rust.lcov.reportPaths=rust/lcov.info,lcov.info

# Header-only C++ analysis via compilation database generated in CI.
sonar.cfamily.compile-commands=cpp/build/sonar/compile_commands.json

# Disable SCM timestamp probing — avoids "Operation not permitted" errors
# when the workspace is mounted from a Windows NTFS volume into the container.
sonar.scm.disabled=true

# Ignore one non-cryptographic PRNG hotspot in optimizer internals.
# This project uses mt19937_64 for stochastic search quality/reproducibility,
# not for security-sensitive randomness.
sonar.issue.ignore.multicriteria=cpp_rng_hotspot
sonar.issue.ignore.multicriteria.cpp_rng_hotspot.ruleKey=cpp:S2245
sonar.issue.ignore.multicriteria.cpp_rng_hotspot.resourceKey=cpp/include/givp/detail/helpers.hpp
